// Todo emblema do evento usa a mesma moldura: estrela vermelha com o logo "The Hollow" no topo. Para reconhecer,
// o ícone é reduzido para 32x32 e comparado com a média destes emblemas, só nos pixels em que eles são iguais
// (a moldura). Nos testes: emblemas do evento ficaram até 0,056 de distância e os outros a partir de 0,086.
const HOLLOW_FRAME_REFS = [1891002643329212, 271857030363653, 1891948702326555, 1102899885295859, 1966960602369150, 1035315791189379];
const HOLLOW_FRAME_MAX = 0.07;
const FRAME_N = 32;

// pixels RGB (0 a 1, sobre fundo preto) do ícone reduzido; em duas etapas, para a redução ficar suave
async function iconPixels(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = url;
  await img.decode();
  const step = document.createElement('canvas'); step.width = step.height = FRAME_N * 2;
  const sc = step.getContext('2d'); sc.imageSmoothingQuality = 'high'; sc.drawImage(img, 0, 0, FRAME_N * 2, FRAME_N * 2);
  const c = document.createElement('canvas'); c.width = c.height = FRAME_N;
  const cx = c.getContext('2d', { willReadFrequently: true }); cx.imageSmoothingQuality = 'high'; cx.drawImage(step, 0, 0, FRAME_N, FRAME_N);
  const d = cx.getImageData(0, 0, FRAME_N, FRAME_N).data, px = new Float32Array(FRAME_N * FRAME_N * 3);
  for (let i = 0; i < FRAME_N * FRAME_N; i++) for (let k = 0; k < 3; k++) px[i * 3 + k] = d[i * 4 + k] / 255 * d[i * 4 + 3] / 255;
  return px;
}

async function badgeIcons(ids) {
  const out = {};
  for (let i = 0; i < ids.length; i += 100) {
    const j = await roproxy(`https://thumbnails.roproxy.com/v1/badges/icons?badgeIds=${ids.slice(i, i + 100).join(',')}&size=150x150&format=Png&isCircular=false`);
    for (const t of j?.data || []) if (t.imageUrl) out[String(t.targetId)] = t.imageUrl;
  }
  return out;
}

// molde da moldura: média dos emblemas de referência e os pixels em que todos concordam
async function hollowFrame() {
  const icons = {};
  for (const g of [...GAMES, HUB]) for (const b of gameData(g.id)?.badges || []) if (HOLLOW_FRAME_REFS.includes(b.id) && b.icon) icons[b.id] = b.icon;
  if (Object.keys(icons).length < HOLLOW_FRAME_REFS.length) Object.assign(icons, await badgeIcons(HOLLOW_FRAME_REFS.filter(id => !icons[id])));
  const refs = await Promise.all(Object.values(icons).map(iconPixels));
  if (refs.length < 4) throw new Error('não consegui baixar os emblemas de referência do The Hollow.');
  const P = FRAME_N * FRAME_N, mean = new Float32Array(P * 3), mask = [];
  for (let i = 0; i < P * 3; i++) mean[i] = refs.reduce((s, r) => s + r[i], 0) / refs.length;
  for (let p = 0; p < P; p++) {
    let sd = 0;
    for (let k = 0; k < 3; k++) { const i = p * 3 + k; sd += Math.sqrt(refs.reduce((s, r) => s + (r[i] - mean[i]) ** 2, 0) / refs.length); }
    if (sd / 3 < 0.06) mask.push(p);
  }
  return px => {
    let s = 0;
    for (const p of mask) for (let k = 0; k < 3; k++) s += Math.abs(px[p * 3 + k] - mean[p * 3 + k]);
    return s / (mask.length * 3) <= HOLLOW_FRAME_MAX;
  };
}

// GET no RoProxy com novas tentativas quando ele pede calma (429)
async function roproxy(url) {
  for (let i = 0; i < 4; i++) {
    const r = await fetch(url, { signal: AbortSignal.timeout(10000) }).catch(() => null);
    if (r?.ok) return r.json();
    if (r && r.status !== 429 && r.status < 500) return null;
    await sleep(1500 * (i + 1));
  }
  return null;
}

// faz `fn` em todos os itens, `n` por vez
async function inPool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) await fn(items[i++]); }));
}

// linha da tabela extra_games: dados do jogo (formato do games-data.js) e todos os emblemas
function extraRow(u, g, list, bIcons, thumb, icon, hollowBadges) {
  return { id: 'u' + u, universe_id: +u, name: cleanGameName(g.name), added_by: acct.user.id, data: {
    universeId: +u, placeId: g.rootPlaceId, title: g.name, desc: g.description, creator: g.creator?.name, verified: !!g.creator?.hasVerifiedBadge,
    playing: g.playing, visits: g.visits, favorites: g.favoritedCount, maxPlayers: g.maxPlayers, created: g.created, updated: g.updated,
    genre: g.genre, thumb, icon, hollowBadges,
    badges: list.filter(b => b.enabled !== false).map(b => ({ id: b.id, name: b.name, desc: b.description, created: b.created, icon: bIcons[String(b.id)],
      day: b.statistics?.pastDayAwardedCount, total: b.statistics?.awardedCount,
      rate: b.statistics ? Math.round(b.statistics.winRatePercentage * 10000) / 100 : null })),
  } };
}

// nome sem as etiquetas do Roblox: "[EVENT🎃] Racket Rivals " → "Racket Rivals"
const cleanGameName = t => t.replace(/\[[^\]]*\]|\([^)]*\)/g, '').replace(/[^\p{L}\p{N}\s&'!:.,-]/gu, '').replace(/\s+/g, ' ').trim() || t.trim();

// O Roblox não deixa listar os emblemas de uma conta sem estar logado nela. Então o app procura os jogos candidatos
// (busca do Roblox e listas da página inicial), separa só os emblemas com a moldura do The Hollow e confere,
// emblema por emblema, quais a conta do Roblox ligada tem. Só os jogos desses emblemas entram no app.
async function scanHollowGames() {
  if (!sb || rank() !== 4) return toast('⚠️ Só a conta Dev pode adicionar jogos.');
  const rid = acct.profile?.roblox_id;
  if (!rid) return toast('⚠️ Ligue sua conta do Roblox em Minha conta primeiro.');
  if (acct.scan) return;
  let lastPaint = 0;
  const step = (s, total = 0) => { acct.scan = { step: s, done: 0, total }; render(); };
  const tick = () => { acct.scan.done++; if (Date.now() - lastPaint > 250) { lastPaint = Date.now(); render(); } };
  try {
    step('Montando o molde da moldura...');
    const isHollow = await hollowFrame();

    // 1. jogos candidatos que ainda não estão no app
    step('Procurando jogos no Roblox...');
    const known = new Set([...GAMES, HUB].map(g => String(gameData(g.id)?.universeId)));
    const cand = new Set();
    const queries = ['The Hollow', '[THE HOLLOW]', 'Hollow event', 'The Hollow quest', '🎃', 'Halloween event', 'Halloween 🎃'];
    for (const q of queries) {
      let token = '';
      for (let page = 0; page < 3; page++) {
        const j = await roproxy(`https://apis.roproxy.com/search-api/omni-search?searchQuery=${encodeURIComponent(q)}&sessionId=hollow&pageType=all&pageToken=${encodeURIComponent(token)}`);
        for (const grp of j?.searchResults || []) for (const c of grp.contents || []) if (c.universeId) cand.add(String(c.universeId));
        if (!(token = j?.nextPageToken)) break;
      }
    }
    for (const sort of ['top-trending', 'up-and-coming', 'top-playing-now', 'fun-with-friends', 'top-revisited']) {
      const j = await roproxy(`https://apis.roproxy.com/explore-api/v1/get-sort-content?sessionId=hollow&sortId=${sort}&device=computer&country=all`);
      for (const g of j?.games || []) if (g.universeId) cand.add(String(g.universeId));
    }
    known.forEach(u => cand.delete(u));

    // 2. só os atualizados desde o começo do Halloween (quem entrou no evento atualizou o jogo)
    const ids = [...cand], games = {};
    step('Lendo os jogos encontrados...', ids.length);
    for (let i = 0; i < ids.length; i += 50) {
      const j = await roproxy(`https://games.roproxy.com/v1/games?universeIds=${ids.slice(i, i + 50).join(',')}`);
      for (const g of j?.data || []) { if (Date.parse(g.updated) >= EVENT_START) games[g.id] = g; tick(); }
    }

    // 3. emblemas de cada jogo (todas as páginas)
    const unis = Object.keys(games), badges = {};
    step('Lendo os emblemas dos jogos...', unis.length);
    await inPool(unis, 3, async u => {
      const list = [];
      let cursor = '';
      for (let page = 0; page < 10; page++) {
        const j = await roproxy(`https://badges.roproxy.com/v1/universes/${u}/badges?limit=100&sortOrder=Desc&cursor=${encodeURIComponent(cursor)}`);
        list.push(...(j?.data || []));
        if (!(cursor = j?.nextPageCursor)) break;
      }
      badges[u] = list.filter(b => b.enabled);
      tick();
    });
    // a moldura do evento não existia antes do Halloween: só os criados desde então precisam ser olhados
    const recent = unis.flatMap(u => badges[u].filter(b => Date.parse(b.created) >= EVENT_START).map(b => [u, b.id]));

    // 4. só os que têm a moldura do The Hollow
    step('Separando os emblemas do The Hollow...', recent.length);
    const icons = await badgeIcons(recent.map(x => x[1]));
    const framed = [];
    await inPool(recent, 6, async item => {
      const url = icons[String(item[1])];
      try { if (url && isHollow(await iconPixels(url))) framed.push(item); } catch {}
      tick();
    });
    if (!framed.length) return toast('🔎 Nenhum jogo novo com emblema do The Hollow foi encontrado.');

    // 5. quais desses a conta do Roblox tem
    step('Conferindo na sua conta do Roblox...', framed.length);
    const owned = [];
    const { failed, note } = await robloxOwned(rid, [...framed], item => owned.push(item), tick);
    const fails = failed ? ` ⚠️ ${failed} emblema(s) não puderam ser conferidos${note}; tente de novo em alguns minutos.` : '';
    const byUni = {};
    for (const [u, bid] of owned) (byUni[u] ||= []).push(bid);
    const found = Object.keys(byUni);
    if (!found.length) return toast(`🔎 Achei ${framed.length} emblema(s) do The Hollow em jogos fora do app, mas a sua conta não tem nenhum.${fails}`);
    if (!confirm(`Você tem emblemas do The Hollow nestes jogos que não estão no app:\n\n${found.map(u => '• ' + cleanGameName(games[u].name)).join('\n')}\n\nAdicionar ${found.length > 1 ? 'esses jogos' : 'esse jogo'} como secundários?`)) return;

    // 6. salva no Supabase com os dados do jogo e todos os emblemas, e já marca os emblemas que a conta tem
    step('Adicionando os jogos...');
    const thumbs = {}, gameIcons = {};
    const [t1, t2] = await Promise.all([
      roproxy(`https://thumbnails.roproxy.com/v1/games/multiget/thumbnails?universeIds=${found.join(',')}&countPerUniverse=1&size=768x432&format=Png&isCircular=false`),
      roproxy(`https://thumbnails.roproxy.com/v1/games/icons?universeIds=${found.join(',')}&size=150x150&format=Png&isCircular=false`),
    ]);
    for (const t of t1?.data || []) thumbs[t.universeId] = t.thumbnails?.[0]?.imageUrl;
    for (const t of t2?.data || []) gameIcons[t.targetId] = t.imageUrl;
    const rows = [];
    for (const u of found) rows.push(extraRow(u, games[u], badges[u], await badgeIcons(badges[u].map(b => b.id)), thumbs[u], gameIcons[u], byUni[u]));
    const { error } = await sb.from('extra_games').upsert(rows);
    if (error) throw error;
    for (const r of rows) {
      addGame(r);
      for (const bid of r.data.hollowBadges) (state.badges[r.id] ||= {})[bid] ||= Date.now();
    }
    save();
    toast(`🎃 ${rows.length} jogo(s) adicionado(s): ${rows.map(r => r.name).join(', ')}.${fails}`);
  } catch (e) {
    toast('⚠️ ' + sbErr(e));
  } finally {
    acct.scan = null;
    render();
  }
}

function openGame(id) {
  if (!byId[id]) return;
  if (ui.view !== 'game') ui.back = ui.view;
  ui.view = 'game'; ui.gameId = id; ui.gameTab = id === 'hub' ? 'eventos' : tut.autoOpen && hasHowTo(id) ? 'comojogar' : 'sobre'; ui.allBadges = false; ui.mkDraft = '';
  if (id === 'hub') refreshEvents();
  render();
  window.scrollTo(0, 0);
  refreshGame(id);
}

// atualiza jogadores online, visitas, favoritos e votos ao vivo; se o RoProxy falhar, fica a cópia baixada
async function refreshGame(id) {
  const d = gameData(id);
  if (!d || live[id]?.at > Date.now() - 60000) return;
  live[id] = { ...live[id], at: Date.now() };
  // os emblemas são buscados à parte: se os números falharem (limite do RoProxy), os emblemas ainda atualizam
  refreshBadges(id);
  try {
    const opts = { signal: AbortSignal.timeout(8000) };
    const [g, v] = await Promise.all([
      fetch(`https://games.roproxy.com/v1/games?universeIds=${d.universeId}`, opts).then(r => r.ok ? r.json() : Promise.reject(r.status)),
      fetch(`https://games.roproxy.com/v1/games/votes?universeIds=${d.universeId}`, opts).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    const x = g.data?.[0];
    if (!x) return;
    live[id] = { ...live[id], playing: x.playing, visits: x.visits, favorites: x.favoritedCount, updated: x.updated,
      ...(v?.data?.[0] ? { up: v.data[0].upVotes, down: v.data[0].downVotes } : {}) };
    if (ui.view === 'game' && ui.gameId === id) render();
  } catch {}
}

// lista de emblemas de um jogo: pelo RoProxy; se ele bloquear (429) ou falhar, pelo servidor (precisa estar logado)
async function badgeList(universeId) {
  try {
    // o Roblox às vezes devolve páginas pequenas: segue o cursor até o fim (no máximo 6 páginas)
    let list = [], cursor = '';
    for (let page = 0; page < 6; page++) {
      const r = await fetch(`https://badges.roproxy.com/v1/universes/${universeId}/badges?limit=100&sortOrder=Desc&cursor=${encodeURIComponent(cursor)}`, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      list.push(...(j.data || []));
      if (!(cursor = j.nextPageCursor)) break;
    }
    return { list, icons: {} };
  } catch {}
  if (!sb || !acct.user) return null;
  const { data, error } = await sb.rpc('roblox_game_badges', { p_universe: universeId });
  return !error && data?.data?.length ? { list: data.data, icons: data.icons || {} } : null;
}

// emblemas atualizados: os criados depois da cópia baixada (ex.: o emblema do evento que saiu depois) passam a aparecer
async function refreshBadges(id) {
  const d = gameData(id);
  if (!d) return;
  try {
    const got = await badgeList(d.universeId);
    if (!got) return;
    const list = got.list.filter(b => b.enabled);
    // descendência dos emblemas do Halloween (os antigos não importam e só ocupariam espaço)
    for (const b of list) if (b.awardingUniverse?.id && Date.parse(b.created) >= EVENT_START) descent[b.id] = b.awardingUniverse.id;
    saveDescent();
    const known = Object.fromEntries((d.badges || []).map(b => [String(b.id), b]));
    const fresh = list.filter(b => !known[String(b.id)]);
    // ícones só dos emblemas novos (os outros já vêm da cópia); o servidor já manda os do Halloween
    const icons = { ...got.icons };
    if (fresh.some(b => !icons[String(b.id)])) {
      const t = await fetch(`https://thumbnails.roproxy.com/v1/badges/icons?badgeIds=${fresh.map(b => b.id).join(',')}&size=150x150&format=Png&isCircular=false`, { signal: AbortSignal.timeout(8000) }).then(r => r.ok ? r.json() : null).catch(() => null);
      for (const i of t?.data || []) icons[String(i.targetId)] = i.imageUrl;
    }
    live[id] = { ...live[id], badges: list.map(b => ({
      id: b.id, name: b.name, desc: b.description, created: b.created,
      icon: known[String(b.id)]?.icon || icons[String(b.id)],
      day: b.statistics?.pastDayAwardedCount, total: b.statistics?.awardedCount,
      rate: b.statistics ? Math.round(b.statistics.winRatePercentage * 10000) / 100 : null,
    })), badgesAt: Date.now() };
    if (fresh.length && ui.view === 'game' && ui.gameId === id) render();
  } catch {}
}

// abre o jogo no app do Roblox; se o app não abrir (a janela não perde o foco), abre a página do jogo no site
function playGame(id) {
  const d = gameData(id);
  if (!d) return toast('⚠️ Não encontrei esse jogo no Roblox.');
  const web = `https://www.roblox.com/games/${d.placeId}`;
  let left = false;
  const onBlur = () => { left = true; };
  window.addEventListener('blur', onBlur, { once: true });
  document.addEventListener('visibilitychange', onBlur, { once: true });
  location.href = `roblox://experiences/start?placeId=${d.placeId}`;
  toast('🎮 Abrindo o Roblox...');
  setTimeout(() => {
    window.removeEventListener('blur', onBlur);
    document.removeEventListener('visibilitychange', onBlur);
    // a janela continua com o foco: o app do Roblox provavelmente não abriu
    if (!left && document.hasFocus()) { window.open(web, '_blank', 'noopener'); toast('🌐 App do Roblox não encontrado: abrindo o jogo no site.'); }
  }, 2500);
}

// kind: 'sure' = emblema do evento com certeza, 'game' = vem de um jogo do evento (descendência conferida), 'prob' = provável, '' = outro
function badgeHTML(b, kind) {
  return `<div class="badge ${kind ? 'event' : ''}">

    <div>
      ${kind === 'sure' ? '<span class="etag">🎃 EMBLEMA DO EVENTO</span>' : kind === 'game' ? '<span class="etag">🎮 EMBLEMA DO JOGO</span>' : kind ? '<span class="etag">🎃 PROVÁVEL EMBLEMA DO EVENTO</span>' : Date.parse(b.created) >= EVENT_START ? '<span class="etag soft">NOVO NO HALLOWEEN</span>' : ''}
      <h4>${esc(b.name)}</h4>
      ${b.desc ? `<p>${esc(b.desc)}</p>` : ''}

}

function renderGame() {

  const owned = state.badges[g.id] || {};
  const checks = state.checks[g.id] || [];
  const missing = (done || isHub ? 0 : 1) + ev.filter(b => !owned[b.id]).length + checks.filter(c => !c.done).length;

      </div>`;
  }

  return `
  <section class="card gp">
    <button class="gp-back" data-gback>← Voltar</button>

      <div class="gp-thumb">
        ${d?.thumb ? `<img src="${esc(d.thumb)}" alt="" onerror="this.src='icons/games/${g.id}.png'">` : `<img src="icons/games/${g.id}.png" alt="">`}

          <button class="gp-play" data-gplay="${g.id}">${icon('i-play')} Jogar</button>

      <div><small>Favoritos</small><b>${fmtN(d?.favorites)}</b></div>
      <div><small>Aprovação</small><b>${votes}</b></div>
      <div><small>Máx. jogadores</small><b>${d?.maxPlayers ?? '—'}</b></div>

/* ----- contas (Supabase): login, cargos, ligação com o Roblox e progresso salvo na nuvem ----- */
const ROLES = {
  dev:       { label: 'Dev',           rank: 4, color: '#a78bfa' },
  admin:     { label: 'Admin',         rank: 3, color: '#f87171' },
  moderador: { label: 'Moderador',     rank: 2, color: '#60a5fa' },
  usuario:   { label: 'Usuário comum', rank: 1, color: '#9a9aa8' },
};
// sem config.js preenchido o app funciona como antes, só no navegador
// um config.js errado (ex.: o endereço do painel no lugar do da API) não pode derrubar o app inteiro: fica sem contas e avisa
let sbConfigError = '';
const sb = (() => {
  if (typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) return null;
  try {
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL)) throw new Error('endereço fora do formato https://xxxx.supabase.co');
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    sbConfigError = e.message;
    console.warn('config.js inválido:', e);
    return null;
  }
})();
const SYNC_KEY = 'hollow-sync-user';
let acct = { user: null, profile: null, link: null, users: null, syncedAt: 0, ready: false };
const rank = () => ROLES[acct.profile?.role]?.rank || 0;
const roleTag = r => `<span class="role" style="--rc:${ROLES[r]?.color || '#999'}">${ROLES[r]?.label || r}</span>`;
const blockedInfo = p => p?.banned ? 'banida' : p?.suspended_until && Date.parse(p.suspended_until) > Date.now() ? 'suspensa' : '';
const sbErr = e => e?.message || String(e);

function acctInit() {
  if (!sb) return;
  sb.auth.onAuthStateChange((event, session) => {
    // o Supabase avisa dentro do próprio callback; o trabalho pesado vai para depois
    setTimeout(() => onSession(event, session), 0);
  });
}

async function onSession(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    const p = prompt('Digite sua nova senha (mínimo 6 caracteres):');
    if (p && p.length >= 6) {
      const { error } = await sb.auth.updateUser({ password: p });
      toast(error ? '⚠️ ' + sbErr(error) : '🔑 Senha alterada!');
    }
  }
  const uid = session?.user?.id || null;
  if (uid === acct.user?.id && acct.profile) return;
  // saiu da conta (por aqui, em outra aba ou porque a sessão acabou): limpa a lista deste aparelho
  if (!uid && acct.user) clearLocalProgress();
  acct.user = session?.user || null;
  acct.profile = null; acct.users = null; acct.link = null; acct.synced = false;
  if (acct.user) { await loadProfile(); await syncDown(); }
  acct.ready = true;
  paintDown();
  loadMyWarnings();
  document.body.classList.toggle('staff', rank() >= 2);
  document.body.classList.toggle('admin', rank() >= 3);
  if (ui.view === 'diag' && rank() < 3) ui.view = 'home'; // saiu da conta ou perdeu o cargo com o Diagnóstico aberto
  applyModes();
  render();
}

async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('*').eq('id', acct.user.id).single();
  if (error) toast('⚠️ Não consegui carregar sua conta: ' + sbErr(error));
  acct.profile = data || null;
}

// ao entrar: o progresso da conta substitui o da tela. Conta nova (sem nada salvo) leva junto o que foi marcado sem conta.
// enquanto o progresso da conta não for baixado (acct.synced), nada é enviado: senão a lista vazia do aparelho apagaria o da nuvem
let syncRetry = null;
// a chave do Tavily salva na conta: usa neste aparelho se ele não tiver uma, e tira do progresso
function takeCloudKeys(d) {
  const t = d?.aiKeys?.tavily;
  if (typeof t === 'string' && t.startsWith('tvly-') && !ai.tkey) { ai.tkey = t; saveAi(); }
  if (d) delete d.aiKeys;
  return t || '';
}
async function syncDown() {
  clearTimeout(syncRetry);
  const uid = acct.user?.id;
  if (!uid) return;
  const { data, error } = await sb.from('user_data').select('data, updated_at').eq('user_id', uid).maybeSingle();
  if (uid !== acct.user?.id) return; // saiu ou trocou de conta enquanto baixava
  if (error) {
    toast('⚠️ Não consegui buscar seu progresso na nuvem. Tentando de novo em 15 segundos...');
    syncRetry = setTimeout(() => syncDown().then(render), 15000);
    return;
  }
  if (data) {
    const cloudKey = takeCloudKeys(data.data);
    state = normalizeState(data.data, state.scope);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
    acct.synced = true;
    // este aparelho tem a chave do Tavily e a conta ainda não: leva para a conta
    if (ai.tkey && cloudKey !== ai.tkey) cloudSave();
  } else {
    acct.synced = true;
    await cloudUpload();
  }
  try { localStorage.setItem(SYNC_KEY, uid); } catch {}
  acct.syncedAt = Date.now();
}

// ao sair: limpa o progresso da tela (ele continua salvo na conta)
function clearLocalProgress() {
  clearTimeout(cloudTimer); clearTimeout(syncRetry);
  acct.synced = false;
  state = normalizeState({}, state.scope);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); localStorage.removeItem(SYNC_KEY); } catch {}
}

let cloudTimer = null;
function cloudSave() {
  if (!sb || !acct.user || !acct.synced || blockedInfo(acct.profile)) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudUpload, 1500);
}
// devolve true se salvou
async function cloudUpload() {
  const uid = acct.user?.id;
  if (!uid || !acct.synced) return false;
  // a chave do Tavily vai junto (só o dono lê o user_data), para o Oráculo pesquisar no Tavily em qualquer aparelho
  const data = ai.tkey ? { ...state, aiKeys: { tavily: ai.tkey } } : state;
  const { error } = await sb.from('user_data').upsert({ user_id: uid, data, updated_at: new Date().toISOString() });
  if (error) { toast('⚠️ Não consegui salvar na nuvem: ' + sbErr(error)); return false; }
  acct.syncedAt = Date.now();
  const s = $('#syncInfo'); if (s) s.textContent = '☁️ Salvo na nuvem às ' + hhmm(acct.syncedAt);
  return true;
}

// para onde os links dos e-mails da conta (confirmar e trocar senha) levam. No app de celular o endereço é interno
// do aparelho, então fica o "Site URL" configurado no Supabase.
const authRedirect = () => window.HollowAndroid ? undefined : location.href.split('#')[0];

// botão Voltar do celular: fecha o que estiver aberto ou volta uma página; no Início devolve false e o app sai
window.hollowBack = () => {
  if (cmd.open) { closeCmd(); return true; }
  if ($('#modalBg').classList.contains('open')) { closeModal(); return true; }
  if ($('#updScreen').classList.contains('on')) return true; // a atualização obrigatória não fecha pelo Voltar
  if ($('#uiScreen').classList.contains('on')) return true; // a escolha da aparência fecha escolhendo uma
  if ($('#restScreen').classList.contains('on')) return true; // o aviso de saúde só fecha pelos botões dele
  if ($('#scaleScreen').classList.contains('on')) { $('[data-scale-done]')?.click(); return true; }
  if (ui.view === 'game') { ui.view = ui.back || 'home'; render(); return true; }
  if (ui.view !== 'home') { ui.view = 'home'; render(); window.scrollTo(0, 0); return true; }
  return false;
};

async function acctAction(act) {
  const v = id => ($('#' + id)?.value || '').trim();
  try {
    if (act === 'login' || act === 'signup') {
      // a tela de manutenção tem o próprio formulário (dsEmail/dsPass) para a equipe entrar
      const email = v('acEmail') || v('dsEmail'), password = $('#acPass')?.value || $('#dsPass')?.value || '';
      if (!email || password.length < 6) return toast('⚠️ Coloque o e-mail e uma senha com pelo menos 6 caracteres.');
      if (act === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        toast('👋 Bem-vindo de volta!');
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: v('acName') }, emailRedirectTo: authRedirect() } });
        if (error) throw error;
        toast(data.session ? '🎉 Conta criada!' : '📧 Conta criada! Confirme pelo link que enviamos no seu e-mail.');
      }
    }
    if (act === 'forgot') {
      const email = v('acEmail');
      if (!email) return toast('⚠️ Coloque seu e-mail no campo acima.');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: authRedirect() });
      if (error) throw error;
      toast('📧 Enviamos um link para trocar a senha.');
    }
    if (act === 'logout' && confirm('Sair da conta?\n\nTudo o que você marcou continua salvo na conta e volta quando você entrar de novo. Neste aparelho, a lista fica limpa.')) {
      // salva a última mudança antes de sair; se não conseguir, avisa antes de limpar a lista
      if (acct.synced && !blockedInfo(acct.profile)) {
        clearTimeout(cloudTimer);
        if (!await cloudUpload() && !confirm('Não consegui salvar as últimas mudanças na conta (sem internet?).\n\nSe sair agora, elas se perdem. Sair mesmo assim?')) return;
      }
      await sb.auth.signOut();
      toast('👋 Você saiu da conta. A lista foi limpa neste aparelho.');
    }
    if (act === 'rbx-start') {
      const name = v('rbxName');
      if (!name) return toast('⚠️ Digite seu usuário do Roblox.');
      const { data, error } = await sb.rpc('roblox_start', { p_username: name });
      if (error) throw error;
      acct.link = data; render();
    }
    if (act === 'rbx-copy') {
      if (window.HollowAndroid) HollowAndroid.copy(acct.link.code); else await navigator.clipboard.writeText(acct.link.code);
      toast('📋 Código copiado!');
    }
    if (act === 'rbx-check') {
      toast('🔎 Conferindo seu perfil do Roblox...');
      const { error } = await sb.rpc('roblox_confirm');
      if (error) throw error;
      acct.link = null; await loadProfile(); render();
      toast('✅ Conta do Roblox ligada! Já pode apagar o código da descrição.');
    }
    if (act === 'rbx-cancel') { acct.link = null; render(); }
    if (act === 'rbx-unlink' && confirm('Desligar a conta do Roblox?')) {
      const { error } = await sb.rpc('roblox_unlink');
      if (error) throw error;
      await loadProfile(); render(); toast('Conta do Roblox desligada.');
    }
  } catch (e) {
    toast('⚠️ ' + sbErr(e).replace('Invalid login credentials', 'E-mail ou senha incorretos.'));
  }
}

function renderAccount() {
  if (!sb) return `
  <section class="card acct">
    <h2>${icon('i-user')} Minha conta</h2>
    <p class="muted">${sbConfigError
      ? `O arquivo config.js está com o endereço do Supabase errado (${esc(sbConfigError)}). O certo é parecido com https://abcdefghijklmnopqrst.supabase.co. Seu progresso continua salvo neste navegador.`
      : typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL
      ? 'Não consegui carregar o sistema de contas (sem internet?). Seu progresso continua salvo neste navegador; recarregue a página quando a internet voltar.'
      : 'As contas ainda não foram configuradas neste site. Por enquanto seu progresso fica salvo só neste navegador.'}</p>
  </section>`;
  if (!acct.ready && !acct.user) return `<section class="card acct"><h2>${icon('i-user')} Minha conta</h2><p class="muted">Carregando...</p></section>`;
  if (!acct.user) {
    const signup = ui.authMode === 'signup';
    return `
  <section class="card acct">
    <h2>${icon('i-user')} ${signup ? 'Criar conta' : 'Entrar'}</h2>

    <div class="seg" style="margin-bottom:16px;width:fit-content">
      <button data-authmode="login" class="${signup ? '' : 'active'}">Entrar</button>

    </div>
    <div class="acct-form">
      ${signup ? '<label>Nome<input id="acName" maxlength="40" placeholder="Como quer ser chamado"></label>' : ''}
      <label>E-mail<input id="acEmail" type="email" autocomplete="email" placeholder="voce@email.com"></label>
      <label>Senha<input id="acPass" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" placeholder="Mínimo 6 caracteres"></label>
      <button class="btn primary" data-acct="${signup ? 'signup' : 'login'}">${signup ? 'Criar conta' : 'Entrar'}</button>
      ${signup ? '<p class="muted small">Depois de criar a conta, você liga o seu usuário do Roblox (sem precisar da senha do Roblox).</p>' : '<button class="linkbtn" data-acct="forgot">Esqueci minha senha</button>'}
    </div>
  </section>`;
  }
  const p = acct.profile;
  if (!p) return `<section class="card acct"><h2>${icon('i-user')} Minha conta</h2><p class="muted">Não consegui carregar sua conta. Recarregue a página.</p><button class="btn" data-acct="logout">Sair</button></section>`;
  if (p.roblox_id && newHome()) return renderProfile(p);
  const blocked = blockedInfo(p);
  const rbx = p.roblox_id
    ? `<div class="rbx-card">
        ${p.roblox_avatar ? `<img src="${esc(p.roblox_avatar)}" alt="">` : '<div class="av">🎮</div>'}
        <div><b>${esc(p.roblox_display || p.roblox_name)}</b><small>@${esc(p.roblox_name)} · verificado em ${fmtD(p.roblox_verified_at)}</small></div>
        <a class="btn" href="https://www.roblox.com/users/${p.roblox_id}/profile" target="_blank" rel="noopener">Ver perfil</a>
        <button class="btn danger" data-acct="rbx-unlink">Desligar</button>
      </div>
      <h4>🏅 Emblemas do evento</h4>
      <p class="muted small">Confere no seu perfil do Roblox quais emblemas do The Hollow você já pegou e marca eles na aba Marcações de cada jogo.
        Seu inventário precisa estar público (Roblox → Configurações → Privacidade → "Quem pode ver meu inventário?" → Todos).</p>
      <div class="gp-row">${badgeCheckBtn()}</div>`
    : acct.link
      ? `<ol class="rbx-steps">
          <li>Abra o seu perfil do Roblox: <a href="https://www.roblox.com/users/${acct.link.id}/profile" target="_blank" rel="noopener">@${esc(acct.link.name)}</a>.</li>
          <li>Edite a descrição ("Sobre") e cole este código em qualquer lugar dela:
            <div class="rbx-code"><code>${esc(acct.link.code)}</code><button class="btn" data-acct="rbx-copy">Copiar</button></div></li>
          <li>Salve a descrição e clique em <b>Verificar</b>. Depois disso você pode apagar o código.</li>
        </ol>
        <div class="gp-row"><button class="btn primary" data-acct="rbx-check">Verificar</button><button class="btn" data-acct="rbx-cancel">Cancelar</button></div>
        <p class="muted small">O código vale por 1 hora. Nunca pedimos a sua senha do Roblox.</p>`
      : `<p class="muted">Ligue o seu usuário do Roblox para mostrar sua conta no site. Sem senha: você só cola um código na descrição do seu perfil para provar que a conta é sua.</p>

  <section class="card acct">

    <div class="acct-head">
      ${p.roblox_avatar ? `<img src="${esc(p.roblox_avatar)}" alt="">` : `<div class="av">${esc((p.display_name || '?')[0].toUpperCase())}</div>`}
      <div><h3>${esc(p.display_name || 'Sem nome')}</h3><small>${esc(p.email || '')}</small><div>${roleTag(p.role)}</div></div>
    </div>
    <div class="muted small" id="syncInfo">${acct.syncedAt ? '☁️ Salvo na nuvem às ' + hhmm(acct.syncedAt) : '☁️ Progresso salvo na nuvem'}</div>

// dados do perfil do Roblox (pelo servidor), guardados por 10 minutos
let rbxProfile = null;
async function loadRbxProfile(force) {
  if (!sb || !acct.profile?.roblox_id || rbxProfile?.loading) return;
  if (!force && rbxProfile && rbxProfile.rid === acct.profile.roblox_id && Date.now() - rbxProfile.at < 10 * 6e4) return;
  rbxProfile = { ...(rbxProfile || {}), loading: true };
  const { data, error } = await sb.rpc('roblox_profile');
  rbxProfile = { at: Date.now(), rid: acct.profile?.roblox_id, data: error ? rbxProfile.data : data, error: error ? sbErr(error) : '' };
  if (data?.headshot && acct.profile) acct.profile.roblox_avatar = data.headshot;
  if (ui.view === 'conta') render();
}

// a página "Minha conta" de quem ligou o Roblox: igual ao perfil do Roblox, com o progresso do evento

          <div class="rp-chips">${roleTag(p.role)}<span class="rp-chip gr">✔ Roblox ligado em ${fmtD(p.roblox_verified_at)}</span>${r?.created ? `<span class="rp-chip">No Roblox desde ${new Date(r.created).getFullYear()}</span>` : ''}</div>

async function loadUsers() {
  // pela função do servidor: a tabela de perfis só deixa cada um ler o próprio, e o e-mail só vem para Admin e Dev
  const { data, error } = await sb.rpc('staff_list_users');
  if (error) { acct.users = []; return toast('⚠️ ' + sbErr(error)); }
  acct.users = data;
  // advertências de todas as contas (a equipe pode ver)
  const w = await sb.from('warnings').select('target, text, author_name, created_at, seen_at').order('created_at', { ascending: false }).limit(500);
  acct.warns = w.error ? [] : w.data;
  if (ui.view === 'admin') render();
}

async function staffAction(fn, args, msg) {
  const { error } = await sb.rpc(fn, args);
  if (error) return toast('⚠️ ' + sbErr(error));
  toast(msg);
  await loadUsers();
}

  const count = r => acct.users.filter(u => u.role === r).length;
  const row = u => {
    const ur = ROLES[u.role]?.rank || 1, self = u.id === acct.user.id, below = ur < me && !self;

        ${st ? `<small class="bad">⛔ ${st === 'banida' ? 'Banida' : 'Suspensa até ' + new Date(u.suspended_until).toLocaleString('pt-BR')}</small>` : ''}
        ${(() => { const ws = (acct.warns || []).filter(w => w.target === u.id); return ws.length ? `<small title="${esc(ws.map(w => `${new Date(w.created_at).toLocaleDateString('pt-BR')} (${w.author_name || 'equipe'}): ${w.text}`).join('\n'))}">⚠️ ${ws.length} advertência(s) · última: "${esc(ws[0].text.slice(0, 60))}" ${ws[0].seen_at ? '(lida)' : '(ainda não leu)'}</small>` : ''; })()}

        ${below ? `<button class="btn" data-uwarn="${u.id}">⚠️ Advertir</button>` : ''}
        ${below && me >= 3 ? `<button class="btn ${u.banned ? '' : 'danger'}" data-uban="${u.id}" data-v="${!u.banned}">${u.banned ? 'Desbanir' : 'Banir'}</button>` : ''}

function addCheck() {
  const inp = $('#mkInput'), t = (inp?.value || '').trim();
  if (!t) return inp?.focus();
  (state.checks[ui.gameId] ||= []).push({ t, done: false });
  ui.mkDraft = '';
  save(); render();
  $('#mkInput')?.focus();
}

function openModal(id) {
  const g = byId[id];
  const d = !!state.done[id];
  const when = state.doneAt[id] ? 'Concluído em ' + new Date(state.doneAt[id]).toLocaleString('pt-BR') : '';
  $('#modal').innerHTML = `
    <div class="modal-head">
      <div class="icon" style="background:radial-gradient(circle at 30% 25%, ${g.c[0]}, ${g.c[1]})">${gameIcon(g)}</div>
      <div><h3>${esc(g.name)}</h3><small>${g.type === 'main' ? '⭐ Jogo principal' : '🎮 Jogo secundário'} · ${d ? '✅ Concluído' : '🕒 Pendente'}</small></div>
      <button class="x" data-close>×</button>
    </div>
    <label for="noteBox">Anotações</label>
    <textarea id="noteBox" placeholder="Ex.: falta pegar o item X, a quest é no mapa Y...">${esc(state.notes[id] || '')}</textarea>
    <div class="meta">${when}</div>
    <div class="actions">
      <button class="btn" data-close>Fechar</button>
      <button class="btn primary" data-modal-toggle="${id}">${d ? 'Marcar como pendente' : '✔ Marcar como concluído'}</button>
    </div>`;
  $('#modalBg').classList.add('open');
  const box = $('#noteBox');
  box.addEventListener('input', () => {
    const v = box.value.trim();
    if (v) state.notes[id] = box.value; else delete state.notes[id];
    save();
  });
  setTimeout(() => box.focus(), 50);
}
function closeModal() { $('#modalBg').classList.remove('open'); render(); }

function download() {
  // no app de celular o navegador não baixa arquivos: o próprio app salva na pasta Downloads
  if (window.HollowAndroid) return HollowAndroid.save('the-hollow-progresso.json', JSON.stringify(state, null, 2));
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'the-hollow-progresso.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); // alguns navegadores ainda estão baixando logo depois do clique
}

  if ((x = el('[data-tut-mode]'))) { tut.mode = x.dataset.tutMode; saveTut(); return render(); }

    if (pilot.on) pilotTick();

  if ((x = el('[data-squad-del]'))) { pilot.squad = pilot.squad.filter(s => s.id !== x.dataset.squadDel); savePilot(); return render(); }

  if ((x = el('[data-fit-copy]'))) return copyFit(+x.dataset.fitCopy);

  if ((x = el('[data-view]'))) { if (cmd.open) closeCmd(); ui.view = x.dataset.view; if (ui.view === 'main' || ui.view === 'sec') ui.tab = ui.view; return render(); }

  if ((x = el('[data-tab]'))) {

      }

      return toast('⚠️ Chave não reconhecida. Gemini começa com AIza ou AQ., Claude com sk-ant-, Tavily com tvly-');
    }
    if (act === 'remove-tkey' && confirm('Remover a chave do Tavily deste navegador?')) { ai.tkey = ''; saveAi(); cloudSave(); render(); toast('Chave do Tavily removida.'); }
    if (act === 'remove-key' && confirm('Remover a chave da API deste navegador?')) {
      if (ai.provider === 'gemini') ai.gkey = ''; else ai.key = '';
      saveAi(); render(); toast('Chave removida.');
    }
    if (act === 'resume-search') { ai.gSearchPausedUntil = 0; ai.gSearchBlock = {}; ai.gDeadModels = {}; saveAi(); render(); toast('🔎 A próxima pergunta vai tentar usar a pesquisa no Google.'); }
    if (act === 'reload-models') loadGeminiModels().then(() => { render(); toast('Lista de modelos atualizada.'); });
    return;
  }
  if ((x = el('[data-ai-provider]')) && !aiStream) {
    if (ai.provider !== x.dataset.aiProvider) { ai.provider = x.dataset.aiProvider; ai.msgs = []; ai.gmsgs = []; ai.view = []; saveAi(); render(); }
    return;
  }
  if ((x = el('[data-act]'))) {
    const act = x.dataset.act;
    if (act === 'dev-toggle') { if (x.classList.contains('active')) return; return toggleDev(); }
    if (act === 'scan-hollow') return scanHollowGames();
    if (act === 'reload-app') return location.reload(); // o progresso já está salvo
    if (act === 'share-progress') return shareProgress();
    if (act === 'toggle-activity') { ui.allActivity = !ui.allActivity; return render(); }
    if (act === 'diag-run') return runDiag();
    if (act === 'track-now') return trackEvent();
    if (act === 'export') return download();
    if (act === 'import') return $('#importFile').click();
    const type = { 'reset-main': 'main', 'reset-sec': 'sec' }[act];
    if (type && confirm(`Desmarcar todos os jogos ${type === 'main' ? 'principais' : 'secundários'}?`)) {
      listOf(type).forEach(g => { delete state.done[g.id]; delete state.doneAt[g.id]; });
      save(); render(); toast('Progresso resetado.');
    }
    if (act === 'reset-all' && confirm('Apagar TODO o progresso e todas as anotações?')) {
      state = normalizeState({}, state.scope);
      save(); render(); toast('Tudo apagado. Recomeçando! 🎃');
    }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'gpNotes') {
    if (e.target.value.trim()) state.notes[ui.gameId] = e.target.value; else delete state.notes[ui.gameId];
    save();
  }
  if (e.target.id === 'mkInput') ui.mkDraft = e.target.value;
  if (e.target.id === 'noticeText') ui.noticeDraft = e.target.value;
  if (e.target.id === 'userQ') {
    ui.userQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = $('#userQ'); s.focus(); s.setSelectionRange(pos, pos);
  }
  if (e.target.id === 'chatInput') {
    ui.draft = e.target.value;
    e.target.style.height = '';
    e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
  }
  if (e.target.id === 'search') {
    ui.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos);
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset.urole) {
    const u = acct.users.find(u => u.id === e.target.dataset.urole), r = e.target.value;
    if (!confirm(`Mudar o cargo de ${u.display_name} para ${ROLES[r].label}?`)) { e.target.value = u.role; return; }
    return staffAction('set_role', { target: u.id, new_role: r }, `🛡️ ${u.display_name} agora é ${ROLES[r].label}.`);
  }
  if (e.target.dataset.gmodel) { ai[e.target.dataset.gmodel] = e.target.value; saveAi(); return toast('Modelo alterado: ' + e.target.value); }
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const file = e.target.files[0];
  e.target.value = ''; // deixa importar o mesmo arquivo de novo
  file.text().then(txt => {
    const data = JSON.parse(txt);
    if (!data || typeof data !== 'object' || !('done' in data)) throw new Error('não é um backup');
    state = normalizeState(data);
    save(); render(); toast('Backup importado! 📥');
  }).catch(() => toast('⚠️ Arquivo inválido: escolha um backup exportado pelo app.'));
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); askAI(e.target.value); }
  if (e.target.id === 'apiKeyInput' && e.key === 'Enter') document.querySelector('[data-ai="save-key"]')?.click();
  if (e.target.id === 'mkInput' && e.key === 'Enter') { e.preventDefault(); addCheck(); }
  if (['acEmail', 'acPass', 'acName'].includes(e.target.id) && e.key === 'Enter') acctAction(ui.authMode === 'signup' ? 'signup' : 'login');
  if (e.target.id === 'rbxName' && e.key === 'Enter') acctAction('rbx-start');
});
// PWA: só funciona quando o app está num site (http/https), não abrindo o arquivo direto
// no app de celular os arquivos já estão dentro do app, então não precisa
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.HollowAndroid) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalBg').classList.contains('open')) closeModal(); });

// proteção: não deixa colar código no chat do Oráculo
document.addEventListener('paste', e => {
  if (e.target.id !== 'chatInput') return;
  const txt = e.clipboardData?.getData('text') || '';
  if (looksLikeCode(txt)) { e.preventDefault(); toast('🔒 Proteção ativa: não é possível colar código no Oráculo.'); }
});

/* ----- Piloto automático (V7.0) ----- */
// A cada 20 s (com o app na tela) o app olha no Roblox se você e o seu esquadrão estão online ou jogando (presença
// pública, pelo RoProxy). Quando você SAI de um jogo, ou volta para o app depois de um tempo fora, ele confere sozinho
// os emblemas do evento na sua conta, marca os jogos concluídos e comemora. Tudo fica numa linha do tempo.
const PILOT_KEY = 'hollow-pilot-v1';
const PILOT_EVERY = 20; // segundos
let pilot = { on: true, squad: [], log: [], auto: 0, lastCheck: 0, session: null };
try { Object.assign(pilot, JSON.parse(localStorage.getItem(PILOT_KEY)) || {}); } catch {}
let pres = {}, heads = {}, pilotBusy = false, hiddenAt = 0;
const savePilot = () => { try { localStorage.setItem(PILOT_KEY, JSON.stringify(pilot)); } catch {} };
const pilotLog = (ic, t) => { pilot.log = [{ at: Date.now(), ic, t }, ...pilot.log].slice(0, 30); savePilot(); };
const myRid = () => acct.profile?.roblox_id ? String(acct.profile.roblox_id) : null;
const PRES = { 0: ['off', '⚫ Offline'], 1: ['on', '🟢 Online'], 2: ['game', '🎮 Jogando'], 3: ['studio', '🛠️ No Studio'], 4: ['off', '⚫ Invisível'] };

async function proxyPost(url, body) {
  for (let i = 0; i < 3; i++) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(9000) }).catch(() => null);
    if (r?.ok) return r.json();
    await sleep(800 * (i + 1));
  }
  return null;
}
async function loadHeads(ids) {
  const miss = ids.filter(id => !heads[id]);
  if (!miss.length) return;
  const j = await roproxy(`https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${miss.join(',')}&size=150x150&format=Png&isCircular=true`).catch(() => null);
  for (const t of j?.data || []) if (t.imageUrl) heads[String(t.targetId)] = t.imageUrl;
}
async function pilotTick() {
  if (pilotBusy || !pilot.on || verNum() < 7 || document.hidden) return;
  const me = myRid(), ids = [...new Set([me, ...pilot.squad.map(s => String(s.id))].filter(Boolean))];
  if (!ids.length) return;
  pilotBusy = true;
  try {
    const j = await proxyPost('https://presence.roproxy.com/v1/presence/users', { userIds: ids.map(Number) });
    if (!j) return;
    const before = pres;
    pres = {};
    for (const p of j.userPresences || []) pres[String(p.userId)] = { type: p.userPresenceType, at: Date.now(), place: p.lastLocation };
    for (const s of pilot.squad) {
      const a = before[s.id]?.type, b = pres[s.id]?.type;
      if (a != null && a !== 2 && b === 2) pilotLog('🎮', `${s.display || s.name} entrou num jogo`);
    }
    if (me) {
      const a = before[me]?.type ?? (pilot.session ? 2 : null), b = pres[me]?.type;
      if (b === 2 && a !== 2) { pilot.session = { start: Date.now() }; pilotLog('🎮', 'Você entrou num jogo do Roblox. O piloto está de olho.'); savePilot(); }
      if (a === 2 && b != null && b !== 2) {
        const mins = pilot.session ? Math.max(1, Math.round((Date.now() - pilot.session.start) / 6e4)) : null;
        pilot.session = null;
        pilotLog('🚪', `Você saiu do jogo${mins ? ` depois de ${mins} min` : ''}. Conferindo o que você fez...`);
        pilotAutoCheck();
      }
    }
    loadHeads(ids).then(() => { if (ui.view === 'piloto') render(); });
    paintPilotPill();
    if (ui.view === 'piloto') render();
  } finally { pilotBusy = false; }
}
// confere os emblemas sozinho (no máximo a cada 2 min)
async function pilotAutoCheck() {
  if (!pilot.on || !sb || !myRid() || acct.checking || Date.now() - pilot.lastCheck < 12e4) return;
  pilot.lastCheck = Date.now(); savePilot();
  paintPilotPill('checking');
  const res = await checkRobloxBadges(undefined, true);
  paintPilotPill();
  if (!res) return;
  if (res.error) return pilotLog('⚠️', `Não consegui conferir agora (${res.error}). Tento de novo na próxima.`);
  const names = res.newly.map(([gid, bid]) => (gameData(gid)?.badges || []).find(b => String(b.id) === String(bid))?.name || (String(bid) === SKULL.badge ? 'The Hollow Skull' : 'emblema')).slice(0, 4);
  if (!res.newly.length) return pilotLog('🔎', 'Conferido: nenhum emblema novo do evento desta vez.');
  pilot.auto += res.newly.length; savePilot();
  pilotLog('🏅', `${res.newly.length} emblema(s) novo(s): ${names.join(', ')}${res.games.length ? ` · ${res.games.map(g => g.name).join(', ')} marcado(s) como concluído(s)` : ''}`);
  pilotCelebrate(res);
}
function pilotCelebrate(res) {
  document.querySelector('.pl-party')?.remove();
  const games = res.games.map(g => `<div class="pl-g">${iconBox(g, 'si')}<b>${esc(g.name)}</b><small class="ok">✔ marcado sozinho</small></div>`).join('');
  document.body.insertAdjacentHTML('beforeend', `<div class="pl-party" data-plparty>
    <div class="pl-pbox"><div class="pl-bot">🤖</div><h2>O piloto marcou pra você!</h2>
      <p>Enquanto você jogava, ele ficou de olho. Você ganhou <b>${res.newly.length} emblema(s) do evento</b>${res.games.length ? ` e ${res.games.length} jogo(s) foram concluídos` : ''}.</p>
      ${games ? `<div class="pl-gs">${games}</div>` : ''}<button class="btn primary" data-plparty>Show! 🎃</button></div></div>`);
  for (let i = 0; i < 5; i++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.25 + Math.random() * .4), ['🏅', '🎃', '✨', '🤖'], 14), i * 300);
}
// selo flutuante "jogando agora" em todas as telas
function paintPilotPill(state) {
  let el = $('#pilotPill');
  if (!el) { document.body.insertAdjacentHTML('beforeend', '<button class="pilot-pill" id="pilotPill" data-view="piloto"></button>'); el = $('#pilotPill'); }
  const me = myRid(), inGame = me && pres[me]?.type === 2;
  const show = verNum() >= 7 && pilot.on && (state === 'checking' || inGame);
  el.classList.toggle('on', !!show);
  if (!show) return;
  el.innerHTML = state === 'checking' ? '<span class="pp-dot spin"></span>🤖 Conferindo seus emblemas...'
    : `<span class="pp-dot"></span>🎮 Jogando agora${pilot.session ? ` · ${Math.max(1, Math.round((Date.now() - pilot.session.start) / 6e4))} min` : ''} · 🤖 piloto ligado`;
}
async function squadAdd(name) {
  name = name.trim().replace(/^@/, '');
  if (!name) return;
  if (pilot.squad.length >= 20) return toast('O esquadrão tem no máximo 20 pessoas.');
  const j = await proxyPost('https://users.roproxy.com/v1/usernames/users', { usernames: [name], excludeBannedUsers: true });
  const u = j?.data?.[0];
  if (!u) return toast(j ? `🔎 Não achei "${name}" no Roblox.` : '⚠️ O Roblox não respondeu agora. Tente de novo em alguns segundos.');
  if (pilot.squad.some(s => String(s.id) === String(u.id)) || String(u.id) === myRid()) return toast('Essa pessoa já está no radar.');
  pilot.squad.push({ id: String(u.id), name: u.name, display: u.displayName });
  pilotLog('➕', `${u.displayName} entrou no seu esquadrão`);
  ui.squadDraft = '';
  await pilotTick(); render();
}
setInterval(pilotTick, PILOT_EVERY * 1000);
setInterval(() => paintPilotPill(), 30000);
// voltou para o app depois de 3+ min fora (provavelmente jogando): confere na hora
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const away = hiddenAt && Date.now() - hiddenAt > 18e4;
  hiddenAt = 0;
  pilotTick().then(() => { if (away && pres[myRid()]?.type !== 2) pilotAutoCheck(); });
});

document.addEventListener('input', e => { if (e.target.id === 'squadInput') ui.squadDraft = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.target.id === 'squadInput' && e.key === 'Enter') { e.preventDefault(); return squadAdd(e.target.value); }
  // tutorial: setas ← → passam os passos (fora de campos de texto)
  if (ui.view === 'game' && ui.gameTab === 'comojogar' && tut.mode === 'passos' && !e.target.closest('input, textarea, select')
    && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && hasHowTo(ui.gameId)) { e.preventDefault(); tutGo(ui.gameId, e.key === 'ArrowRight' ? 1 : -1); }
});
// tutorial no celular: arrastar para o lado passa os passos
let tutTouch = null;
document.addEventListener('touchstart', e => { const c = e.target.closest('[data-tut-swipe]'); tutTouch = c ? { id: c.dataset.tutSwipe, x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!tutTouch) return;
  const dx = e.changedTouches[0].clientX - tutTouch.x, dy = e.changedTouches[0].clientY - tutTouch.y, id = tutTouch.id;
  tutTouch = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) tutGo(id, dx < 0 ? 1 : -1);
}, { passive: true });

function renderPilot() {
  const me = myRid(), mp = me && pres[me], st = PRES[mp?.type] || ['unk', '❔ Ainda não sei'];
  const ring = pilot.squad.map((s, i, a) => {
    const p = PRES[pres[s.id]?.type] || ['unk', '❔'], ang = (i / Math.max(1, a.length)) * Math.PI * 2 - Math.PI / 2;
    const r = p[0] === 'game' ? 30 : p[0] === 'on' ? 38 : 45; // quem está jogando fica mais perto do centro
    return `<div class="rd-blip ${p[0]}" style="left:${50 + Math.cos(ang) * r}%;top:${50 + Math.sin(ang) * r}%" title="${esc(s.display || s.name)} · ${p[1]}">
      ${heads[s.id] ? `<img src="${esc(heads[s.id])}" alt="">` : '👤'}<em>${esc(s.display || s.name)}</em></div>`;
  }).join('');
  const playing = pilot.squad.filter(s => pres[s.id]?.type === 2);
  return `
  <section class="card pl-hero">
    <div class="radar">
      <div class="rd-sweep"></div><div class="rd-ring r1"></div><div class="rd-ring r2"></div><div class="rd-ring r3"></div>
      <div class="rd-me ${st[0]}">${me && (heads[me] || acct.profile?.roblox_avatar) ? `<img src="${esc(heads[me] || acct.profile.roblox_avatar)}" alt="">` : '<span>🎃</span>'}</div>
      ${ring}
    </div>
    <div class="pl-info">
      <small>V7.0 · PILOTO AUTOMÁTICO</small>
      <h2>Você joga. O app marca sozinho.</h2>
      <p>Ele percebe quando você entra e sai de um jogo do Roblox, confere os emblemas do evento na sua conta e marca os jogos concluídos, sem você apertar nada.</p>
      <div class="pl-status">
        <span class="pl-chip ${st[0]}">Você: ${st[1]}${mp?.type === 2 && pilot.session ? ` há ${Math.max(1, Math.round((Date.now() - pilot.session.start) / 6e4))} min` : ''}</span>
        <span class="pl-chip">🏅 ${pilot.auto} emblema(s) marcado(s) sozinho</span>
        <span class="pl-chip">🔄 a cada ${PILOT_EVERY} s</span>
      </div>
      <div class="gp-row">
        <div class="seg"><button data-pilot="on" class="${pilot.on ? 'active' : ''}">🤖 Ligado</button><button data-pilot="off" class="${pilot.on ? '' : 'active'}">Desligado</button></div>
        ${me ? `<button class="btn" data-pilot="check" ${acct.checking ? 'disabled' : ''}>🔎 Conferir agora</button>` : ''}
      </div>
    </div>
  </section>
  ${!me ? `<div class="acct-block" style="background:rgba(232,137,79,.08);border-color:#6b3a1a;color:var(--text)">🎮 Para o piloto conferir os <b>seus</b> emblemas, entre na conta e ligue o Roblox em <button class="linkbtn" data-view="conta">Minha conta</button>. O radar do esquadrão funciona mesmo sem conta.</div>` : ''}
  <section class="pl-how">
    <div class="card"><span>🎮</span><b>1. Você joga</b><small>Abra qualquer jogo do evento no Roblox, no celular ou no PC.</small></div>
    <div class="card"><span>📡</span><b>2. O app percebe</b><small>A cada ${PILOT_EVERY} s ele olha se você está online, jogando ou saiu.</small></div>
    <div class="card"><span>🏅</span><b>3. Marca sozinho</b><small>Quando você sai do jogo, ele confere seus emblemas e comemora.</small></div>
  </section>
  <section class="card dash">
    <div class="dash-h"><span>👥</span><div><h3>Seu esquadrão</h3><small>${playing.length ? `${playing.length} jogando agora: ${playing.map(s => esc(s.display || s.name)).join(', ')}` : 'Amigos que fazem o evento com você, ao vivo no radar'}</small></div></div>
    <div class="mk-add"><input id="squadInput" placeholder="Nome de usuário do Roblox (ex.: builderman)" maxlength="40" value="${esc(ui.squadDraft || '')}"><button class="btn primary" data-squad-add>➕ Adicionar</button></div>
    <div class="sq-list">${pilot.squad.map(s => { const p = PRES[pres[s.id]?.type] || ['unk', '❔ ainda não sei']; return `
      <div class="sq-row"><div class="sq-av ${p[0]}">${heads[s.id] ? `<img src="${esc(heads[s.id])}" alt="">` : '👤'}</div>
        <div><b>${esc(s.display || s.name)}</b><small>@${esc(s.name)}</small></div><span class="pl-chip ${p[0]}">${p[1]}</span>
        <a class="btn" href="https://www.roblox.com/users/${esc(s.id)}/profile" target="_blank" rel="noopener">Perfil</a><button class="del" data-squad-del="${esc(s.id)}" title="Tirar do esquadrão">×</button></div>`; }).join('')
      || '<div class="mk-empty">Ninguém ainda. Adicione o nome de usuário dos seus amigos do Roblox.</div>'}</div>
    <p class="gp-note">O Roblox não mostra em que jogo cada pessoa está para quem não é amigo dela; o radar mostra se está offline, online ou jogando.</p>
  </section>
  <section class="card dash">
    <div class="dash-h"><span>🕒</span><div><h3>Linha do tempo</h3><small>Tudo o que o piloto viu e fez</small></div></div>
    ${pilot.log.length ? `<div class="pl-log">${pilot.log.map(l => `<div><span>${l.ic}</span><p>${esc(l.t)}</p><small>${agoText(l.at)}</small></div>`).join('')}</div>` : '<div class="mk-empty">Nada ainda. Abra um jogo do Roblox e volte aqui.</div>'}
  </section>`;
}

/* ----- tamanho da tela: cada jogador escolhe (celulares e tablets têm telas e fontes muito diferentes) ----- */
// o app inteiro é ampliado ou reduzido (de 60% a 150%); fica salvo só neste aparelho
const SCALE_KEY = 'hollow-scale-v1';
let uiScale = { v: 1, asked: false };
try { Object.assign(uiScale, JSON.parse(localStorage.getItem(SCALE_KEY)) || {}); } catch {}
const saveScale = () => { try { localStorage.setItem(SCALE_KEY, JSON.stringify(uiScale)); } catch {} };
const applyScale = () => { document.documentElement.style.zoom = uiScale.v === 1 ? '' : String(uiScale.v); };
const SCALE_PRESETS = [[0.8, 'Pequeno'], [1, 'Normal'], [1.15, 'Grande'], [1.3, 'Muito grande']];
function setScale(v) {
  uiScale.v = Math.min(1.5, Math.max(0.6, Math.round(v * 20) / 20)); // passos de 5%
  applyScale(); saveScale();
  const val = $('#scVal'), rng = $('#scRange');
  if (val) val.textContent = Math.round(uiScale.v * 100) + '%';
  if (rng) rng.value = Math.round(uiScale.v * 100);
  document.querySelectorAll('[data-scale-set]').forEach(b => b.classList.toggle('primary', +b.dataset.scaleSet === uiScale.v));
}
function openScale() {
  const el = $('#scaleScreen');
  el.classList.add('on');
  el.innerHTML = `<div class="ov-box">
    <div class="big">🔍</div>
    <h2>Tamanho da tela</h2>
    <p>Deixe o The Hollow do tamanho mais confortável para a sua tela. O app atrás já muda enquanto você ajusta.</p>
    <div class="sc-val" id="scVal">${Math.round(uiScale.v * 100)}%</div>
    <div class="sc-row"><button class="btn" data-scale-step="-0.05" title="Diminuir">−</button>
      <input type="range" id="scRange" min="60" max="150" step="5" value="${Math.round(uiScale.v * 100)}" aria-label="Tamanho da tela">
      <button class="btn" data-scale-step="0.05" title="Aumentar">+</button></div>
    <div class="sc-pre">${SCALE_PRESETS.map(([v, l]) => `<button class="btn ${v === uiScale.v ? 'primary' : ''}" data-scale-set="${v}">${l}</button>`).join('')}</div>
    <p class="small muted">Dá para mudar quando quiser em Configurações → Tamanho da tela.</p>
    <button class="btn primary" data-scale-done style="width:100%">Pronto</button>
  </div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-scale-step], [data-scale-set], [data-scale-done], [data-scale-open]');
  if (!b) return;
  if (b.dataset.scaleStep) setScale(uiScale.v + +b.dataset.scaleStep);
  else if (b.dataset.scaleSet) setScale(+b.dataset.scaleSet);
  else if (b.hasAttribute('data-scale-open')) openScale();
  else { uiScale.asked = true; saveScale(); $('#scaleScreen').classList.remove('on'); $('#scaleScreen').innerHTML = ''; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'scRange') setScale(+e.target.value / 100); });
applyScale();

applyModes();
acctInit();
loadExtraGames();
loadNotice();
loadSiteStatus();
render();
// V7.0: ao abrir, confere se tem versão nova (atualização obrigatória) e se a versão antiga em uso foi descontinuada
checkUpdates();
// primeira vez na V7.0: escolhe a interface (clássica ou moderna); depois, no celular, o tamanho da tela
if (verNum() >= 7 && !uiPref.style) openUiChoice(true);
else if (!uiScale.asked && (window.HollowAndroid || matchMedia('(pointer: coarse)').matches)) openScale();
// o app abriu certo: avisa o celular (se um pacote novo quebrar a abertura duas vezes, ele volta para o anterior)
try { window.HollowAndroid?.bootOk?.(); } catch {}
pilotTick();
// olha a moldura dos emblemas logo depois de abrir (cerca de 1 s, uma vez só: fica guardado), para os selos "emblema do evento" já virem certos
setTimeout(() => scanFrames().then(() => { if (['game', 'museu', 'home'].includes(ui.view) || onEventTab()) render(); }).catch(() => {}), 4000);
</script>
