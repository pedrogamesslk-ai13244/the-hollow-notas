Se não souber algo específico, diga isso com sinceridade e sugira onde o jogador pode conferir (ex.: página do evento no Roblox, wiki do jogo, Discord oficial).`;

// uma tentativa com um modelo: transmite a resposta para a tela e devolve o resultado (nunca lança erro)
// raciocínio: 'full' = pensa à vontade e mostra o resumo; 'low' = pensa o mínimo (bem mais rápido); false = padrão do modelo
function thinkingConfigFor(model, thinking) {
  if (thinking === 'full') return { thinkingConfig: { includeThoughts: true } };
  if (thinking === 'low') return { thinkingConfig: /^gemini-2\./.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'low' } };
  return {};
}

async function geminiAttempt({ model, search, thinking, system, contents, view, signal, note, timeoutMs = 60000 }) {
  const ctrl = new AbortController();
  const onAbort = () => ctrl.abort();
  signal.addEventListener('abort', onAbort);
  // desiste deste modelo se ele ficar 60s sem mandar nada (fila de servidor lotado)
  let last = Date.now(), timedOut = false;
  const timer = setInterval(() => { if (Date.now() - last > timeoutMs) { timedOut = true; ctrl.abort(); } }, 1000);
  const textStart = view.text.length, thinkStart = view.thinking.length;
  const out = { ok: false, status: 0, msg: '', gotText: false, finish: '', blocked: '', queries: [] };
  note(`→ ${model} (pesquisa ${search ? 'ligada' : 'desligada'}, raciocínio ${{ full: 'completo', low: 'mínimo' }[thinking] || 'padrão'})`);
  try {
    const res = await fetch(`${gModelUrl(model, 'streamGenerateContent')}?alt=sse&${gKeyParam()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents,
        tools: search ? [{ google_search: {} }] : undefined,
        generationConfig: thinkingConfigFor(model, thinking),
      }),
    });
    last = Date.now();
    note(`← HTTP ${res.status}`);
    if (!res.ok) {
      out.status = res.status;
      out.msg = (await res.json().catch(() => ({}))).error?.message || res.statusText;
      note('erro: ' + out.msg.slice(0, 160));
      return out;
    }

    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '', bytes = 0, chunks = 0, unparsed = '';
    const handleEvent = evt => {
      const data = evt.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
      if (!data) { if (evt.trim()) unparsed ||= evt.trim().slice(0, 300); return; }
      let chunk;
      try { chunk = JSON.parse(data); } catch { unparsed ||= data.slice(0, 300); return; }
      chunks++;
      // erro no meio da resposta (ex.: servidor lotado depois de começar)
      if (chunk.error) { out.status = chunk.error.code || 500; out.msg = chunk.error.message || 'erro no meio da resposta'; throw out; }
      if (chunk.promptFeedback?.blockReason) out.blocked = chunk.promptFeedback.blockReason;
      const cand = chunk.candidates?.[0];
      if (!cand) return;
      for (const p of cand.content?.parts || []) {
        if (!p.text) continue;
        if (p.thought) view.thinking += p.text;
        else { view.text += p.text; out.gotText = true; }
      }
      const gm = cand.groundingMetadata;
      for (const q of gm?.webSearchQueries || []) if (!out.queries.includes(q)) out.queries.push(q);
      for (const c of gm?.groundingChunks || []) {
        const w = c.web;
        if (w?.uri && !view.sources.some(s => s.url === w.uri)) view.sources.push({ url: w.uri, title: w.title });
      }
      if (out.queries.length) view.steps = [...view.steps.filter(s => !s.query), ...out.queries.map(q => ({ label: '🔎 ' + q, query: true }))];
      if (cand.finishReason) out.finish = cand.finishReason;
      paintChat();
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      last = Date.now();
      if (!bytes) note('primeiros dados recebidos');
      bytes += value.length;
      buf += value;
      const events = buf.split(/\r?\n\r?\n/);
      buf = events.pop();
      events.forEach(handleEvent);
    }
    if (buf.trim()) handleEvent(buf);
    note(`fim: ${chunks} pedaços, ${bytes} bytes, finishReason=${out.finish || 'nenhum'}${out.blocked ? ', bloqueado=' + out.blocked : ''}`);
    if (unparsed) note('trecho não reconhecido: ' + unparsed);
    out.ok = true;
    return out;
  } catch (e) {
    if (e === out) note(`erro no meio da resposta: ${out.status} ${out.msg.slice(0, 160)}`);
    else if (signal.aborted) out.aborted = true;
    else if (timedOut) { out.status = 'timeout'; out.msg = 'o modelo ficou 60s sem mandar nada'; note('⏱️ 60s sem dados, desistindo deste modelo'); }
    else { out.status = 'rede'; out.msg = e?.message || String(e); note('exceção: ' + out.msg); }
    // tentativa falhou antes de escrever a resposta: limpa o raciocínio parcial dela
    if (!out.gotText) { view.text = view.text.slice(0, textStart); view.thinking = view.thinking.slice(0, thinkStart); }
    return out;
  } finally {
    clearInterval(timer);
    signal.removeEventListener('abort', onAbort);
  }
}

async function askGemini(question) {
  ui.draft = '';
  const input = $('#chatInput');
  if (input) { input.value = ''; input.style.height = ''; }

  const t0 = Date.now(), log = [];
  const note = s => log.push(`[${((Date.now() - t0) / 1000).toFixed(1)}s] ${s}`);
  const view = { role: 'ai', text: '', thinking: '', steps: [], sources: [], cited: true, status: 'streaming', started: t0 };
  const mem = relatedMemory(question), memNote = memoryNote(mem);
  if (mem.length) { view.memUsed = mem.length; note(`memória: ${mem.length} registro(s) parecido(s)`); }
  const step = label => { view.steps.push({ label }); paintChat(); };
  ai.view.push({ role: 'user', text: question }, view);
  const userMsg = { role: 'user', parts: [{ text: `${progressBlock()}\n\n${question}` }] };
  const ctrl = new AbortController();
  aiStream = { aborted: false, abort() { this.aborted = true; ctrl.abort(); } };
  refreshChatControls();
  paintChat('bottom');
  const ticker = setInterval(() => paintChat(), 1000);
  const attempts = [], searchFails = [];
  let tav = null;

  try {
    if (!ai.gModelDeep || !ai.gModelFast) await loadGeminiModels();
    const deep = ai.mode === 'deep';
    // a cota é separada por modelo: se o escolhido falhar, tenta os outros flash/flash-lite estáveis
    const stableFlash = ai.gModels.filter(n => /^gemini-[\d.]+-flash(-lite)?$/.test(n)).sort((a, b) => geminiScore(b) - geminiScore(a));
    // começa pelo último modelo que funcionou neste modo; no Rápido prefere o flash-lite (o mais veloz)
    const candidates = [...new Set([
      ai.gLastGood?.[ai.mode],
      ...(deep ? [ai.gModelDeep] : [ai.gModelFast, PREFERRED_LITE, ...stableFlash.filter(n => n.endsWith('-lite')).slice(0, 1)]),
      ai.gModelFast,
      PREFERRED_LITE,
      ...stableFlash,
      ...(ai.gModels.length ? [] : ['gemini-2.5-flash-lite', 'gemini-2.5-flash']),
    ].filter(n => n && (!ai.gModels.length || ai.gModels.includes(n))))].slice(0, 6);
    let system = SYSTEM() + NO_CODE_NOTE + eventFacts() + memNote + (deep
      ? '\n\nMODO PROFUNDO: faça muitas pesquisas diferentes no Google, compare fontes e dê uma resposta completa e verificada.'
      : '\n\nMODO RÁPIDO: SEMPRE use a ferramenta de pesquisa do Google antes de responder (1 ou 2 pesquisas, nunca zero). Sem introdução, mas NÃO seja vago: dê o passo a passo numerado com os detalhes concretos (onde ir, o que fazer, itens necessários, nome da badge/recompensa).');

    // com chave do Tavily o próprio app pesquisa e entrega os resultados (funciona com qualquer modelo, mesmo na cota grátis)
    if (ai.tkey && verNum() >= 2) {
      view.steps = [{ label: '🔎 Pesquisando na web (Tavily)...', live: true }];
      paintChat();
      tav = await tavilySearch(question, deep, ctrl.signal, note);
    }
    const useTavily = !!tav?.results.length;
    if (useTavily) {
      for (const r of tav.results) view.sources.push({ url: r.url, title: r.title });
      system = SYSTEM() + NO_CODE_NOTE + eventFacts() + memNote + (deep
        ? '\n\nMODO PROFUNDO: compare as fontes dos resultados abaixo e dê uma resposta COMPLETA, DETALHADA e verificada: passo a passo numerado com todos os detalhes técnicos que as fontes trazem (onde fica cada coisa, itens/ferramentas necessários, requisitos, ordem das tarefas, nome exato da badge/recompensa, tempo aproximado), dicas, erros comuns e o que fazer se travar. Aponte quando as fontes discordam.'
        : '\n\nMODO RÁPIDO: sem introdução, mas NÃO seja vago: dê o passo a passo numerado com os detalhes concretos das fontes (onde ir, o que fazer, itens necessários, nome da badge/recompensa) e 1 ou 2 dicas. Nunca responda com passos genéricos como "procure a missão" ou "complete a tarefa": diga exatamente qual é.')
        + `\n\nRESULTADOS DA PESQUISA NA WEB (o app acabou de pesquisar por você; você NÃO tem ferramenta de pesquisa, não tente chamar nenhuma).
Use estes resultados como fonte principal e cite os links que usar no formato [título](url). Se eles não responderem a pergunta, diga isso e complete com o que você já sabe, avisando que pode estar desatualizado.

${tav.results.map((r, i) => `[${i + 1}] ${r.title}\n${r.url}\nResumo: ${r.content || ''}\nTexto da página: ${(r.raw_content || '').replace(/\s+/g, ' ').slice(0, deep ? 8000 : 4000)}`).join('\n\n')}`;
    }

    // a pesquisa é liberada por modelo: na cota grátis os Gemini 3.x não pesquisam, mas os 2.5 Flash/Flash-Lite sim.
    // então primeiro tenta TODOS os modelos que podem pesquisar e só depois responde sem pesquisa
    const searchOn = !useTavily && Date.now() >= (ai.gSearchPausedUntil || 0);
    // os modelos com pesquisa grátis entram logo depois do preferido, senão os 3.x enchem as 5 vagas e eles nunca são testados.
    // não filtra pela lista da chave: se algum não existir mais, o 404 é rápido e ele é pulado
    const searchPool = searchOn ? [...new Set([candidates[0], ...FREE_SEARCH_MODELS, ...candidates])].filter(m => m && !searchBlocked(m) && !(m in (ai.gDeadModels || {}))).slice(0, 5) : [];
    const plan = [...searchPool.map(model => ({ model, search: true })), ...candidates.slice(0, 4).map(model => ({ model, search: false }))];
    note(`backend: ${ai.gBackend || 'studio'} · modelos disponíveis: ${ai.gModels.length}`);
    note(`com pesquisa: ${searchPool.join(', ') || 'nenhum'}${searchOn ? '' : ' (pesquisa pausada)'}`);
    const blockedNow = Object.keys(ai.gSearchBlock || {}).filter(searchBlocked);
    if (blockedNow.length) note(`sem pesquisa por enquanto: ${blockedNow.join(', ')}`);
    view.steps = useTavily
      ? [...tav.queries.map(q => ({ label: '🔎 ' + q, query: true })), { label: '🧠 Lendo os resultados e respondendo...', live: true }]
      : [{ label: searchPool.length ? '🧠 Pensando e pesquisando no Google...' : '🧠 Pensando (nenhum modelo com pesquisa disponível agora)...', live: true }];

    let result = null, last = null, usedModel = '', usedSearch = false;
    const dead = new Set();
    for (let i = 0; i < plan.length && !result; i++) {
      const { model, search: s } = plan[i];
      if (dead.has(model)) continue;
      if (!s && i === searchPool.length && searchPool.length) step('🔁 Nenhum modelo conseguiu pesquisar; respondendo sem a pesquisa');
      let thinking = deep ? 'full' : 'low', retried = false;
      for (;;) {
        const r = await geminiAttempt({ model, search: s, thinking, system: s || useTavily ? system : system + NO_SEARCH_NOTE, contents: [...ai.gmsgs, userMsg], view, signal: ctrl.signal, note, timeoutMs: deep ? 60000 : 25000 });
        if (r.aborted) throw new Error('aborted');
        // terminou "certo" mas sem texto (ex.: tentou chamar uma ferramenta que não existe): conta como falha
        if (r.ok && !r.gotText && !r.blocked) { r.ok = false; r.status = 'vazio'; r.msg = 'terminou sem texto (finishReason=' + (r.finish || 'nenhum') + ')'; }
        if (r.ok || r.gotText) {
          result = r; usedModel = model; usedSearch = s;
          if (r.ok) ai.gLastGood = { ...ai.gLastGood, [ai.mode]: model };
          break;
        }
        last = r;
        attempts.push(`${model}${s ? '' : ' (sem pesquisa)'} → ${r.status}: ${r.msg}`);
        if (r.status === 400 && thinking && /think|thought/i.test(r.msg)) { thinking = false; continue; }
        const why = { 429: 'sem cota', 403: 'sem permissão', 404: 'não existe', 400: 'recusou o pedido', timeout: 'demorou demais', rede: 'falha de conexão', vazio: 'respondeu vazio' }[r.status]
          || (r.status >= 500 ? 'sobrecarregado' : 'erro ' + r.status);
        if (r.status === 404) { dead.add(model); ai.gDeadModels = { ...ai.gDeadModels, [model]: Date.now() }; }
        // este modelo não consegue pesquisar (sem cota ou sem acesso à pesquisa): marca e passa para o próximo COM pesquisa
        if (s && [400, 403, 429].includes(r.status)) {
          // "limit: 0" = a cota nem existe (ex.: Gemini 3 na cota grátis), não adianta tentar de novo logo
          const long = r.status !== 429 || /limit:\s*0\b/.test(r.msg);
          ai.gSearchBlock = { ...ai.gSearchBlock, [model]: Date.now() + (long ? SEARCH_BLOCK_MS : SEARCH_PAUSE_MS) };
          searchFails.push(`${model}: ${why} com pesquisa (${r.status}${long ? ', bloqueado por 12h' : ', bloqueado por 30 min'})`);
          step(`⏭️ ${model} não conseguiu pesquisar (${why}); tentando outro modelo com pesquisa`);
          break;
        }
        // servidor lotado ou lento: espera um pouco e tenta o mesmo modelo mais uma vez
        if ((r.status >= 500 || r.status === 'timeout' || r.status === 'rede' || r.status === 'vazio') && !retried) {
          // resposta vazia: na segunda vez tenta sem o modo de raciocínio
          if (r.status === 'vazio') thinking = false;
          retried = true;
          step(`⏳ ${model} ${why}, tentando de novo...`);
          await sleep(3000);
          if (ctrl.signal.aborted) throw new Error('aborted');
          continue;
        }
        step(i + 1 < plan.length ? `⏭️ ${model} ${why}, tentando outro modelo` : `❌ ${model} ${why}`);
        break;
      }
    }

    if (!result) {
      const quota = attempts.some(a => / → 429:/.test(a));
      const busy = attempts.some(a => / → (5\d\d|timeout):/.test(a));
      if (quota && busy) throw new Error('A cota da sua chave acabou para alguns modelos e os outros estão com os servidores lotados agora. Tente de novo em alguns minutos.');
      throw new Error(geminiError(last?.status, last?.msg || ''));
    }

    view.steps.forEach(s => s.live = false);
    view.steps = view.steps.filter(s => !s.label.startsWith('🧠'));
    if (usedModel !== candidates[0]) view.steps.push({ label: '✅ Respondido com ' + usedModel });
    if (result.blocked || /SAFETY|PROHIBITED|BLOCKLIST|SPII|RECITATION/.test(result.finish)) {
      view.error = 'O Gemini bloqueou essa resposta. Tente reformular a pergunta.';
    } else {
      if (!result.ok) view.error = `A resposta foi cortada no meio por um erro do Google (${result.status}). Tente perguntar de novo.`;
      else if (result.finish && result.finish !== 'STOP' && result.finish !== 'MAX_TOKENS') note('finishReason incomum: ' + result.finish);
      else if (result.finish === 'MAX_TOKENS') view.error = 'A resposta ficou longa demais e foi cortada.';
      if (view.text) ai.gmsgs = [...ai.gmsgs, userMsg, { role: 'model', parts: [{ text: view.text }] }];
      else view.error ||= 'O Gemini não retornou resposta. Tente de novo.';
    }
    // avisos ficam nos detalhes técnicos para a resposta ficar limpa
    const warn = searchReport({ usedSearch, usedModel, queries: result.queries, sources: view.sources.length, searchOn, searchFails, tav });
    // se o modelo mesmo assim abrir a resposta com um "> Aviso: ...", move para os detalhes
    const lead = view.text.match(/^\s*>[^\n]*(?:aviso|pesquisa)[^\n]*(?:\n>[^\n]*)*\n*/i);
    if (lead) { warn.push('Aviso do modelo: ' + lead[0].replace(/^\s*>\s?/gm, '').trim(), ''); view.text = view.text.slice(lead[0].length); }
    // os detalhes técnicos sempre aparecem, para mostrar se a pesquisa foi usada
    view.details = [...warn, ...attempts, ...(attempts.length ? [''] : []), ...log].join('\n');
    rememberInvestigation(question, view, mem);
  } catch (err) {
    view.error = aiStream?.aborted ? 'Resposta interrompida.' : err.message;
    view.details = [...searchReport({ searchOn: Date.now() >= (ai.gSearchPausedUntil || 0), searchFails, tav }), ...attempts, ...log].join('\n');
    view.steps = view.steps.filter(s => !s.live);
  } finally {
    clearInterval(ticker);
    view.status = 'done';
    aiStream = null;
    saveAi();
    refreshChatControls();
    paintChat();
  }
}

/* ----- memória de investigação do Oráculo ----- */
// Depois de cada resposta, o Oráculo guarda um registro: pergunta, conclusão, fontes (com a data da consulta), fatos
// confirmados, hipóteses, dúvidas e o que precisa ser conferido de novo. Numa pergunta parecida, os registros entram
// na pesquisa e o Oráculo confere se continuam valendo antes de responder. Fica neste navegador (no máximo 40 registros).
const MEM_MAX = 40, MEM_STALE = 6 * 36e5; // depois de 6 horas o registro precisa ser conferido de novo
ai.memory ||= [];
const memWords = t => new Set(normText(t).split(' ').filter(w => w.length > 3 && !['como', 'para', 'onde', 'qual', 'quais', 'quando', 'fazer', 'evento', 'hollow', 'roblox', 'jogo'].includes(w)));
// registros da mesma pergunta/jogo (os 3 mais parecidos)
function relatedMemory(question) {
  const g = gameInQuestion(question), w = memWords(question);
  return ai.memory.map(r => {
    const rw = memWords(r.q + ' ' + (r.topic || ''));
    const common = [...w].filter(x => rw.has(x)).length;
    const score = (g && r.game === g.id ? 2 : 0) + common / Math.max(1, Math.min(w.size, rw.size));
    return { r, score };
  }).filter(x => x.score >= 0.5).sort((a, b) => b.score - a.score).slice(0, 3).map(x => x.r);
}
function memoryNote(recs) {
  if (!recs.length) return '';
  return `\n\nMEMÓRIA DE INVESTIGAÇÃO (registros de perguntas anteriores parecidas; use como ponto de partida, NÃO como verdade final):
${recs.map((r, i) => `[registro ${i + 1}] pergunta: "${r.q}" · conferido em ${new Date(r.checkedAt).toLocaleString('pt-BR')}${Date.now() - r.checkedAt > MEM_STALE ? ' (ANTIGO: confira de novo)' : ''}
conclusão: ${r.conclusion}
fatos confirmados: ${r.facts.join(' | ') || '—'}
hipóteses: ${r.hypotheses.join(' | ') || '—'}
dúvidas: ${r.doubts.join(' | ') || '—'}
conferir de novo: ${r.recheck.join(' | ') || '—'}
fontes: ${r.sources.slice(0, 5).map(s => s.url).join(' ') || '—'}`).join('\n\n')}
Confira esses registros com a pesquisa de agora. Se continuarem certos, diga que foram confirmados de novo; se algo mudou, diga o que mudou. Não repita hipóteses como se fossem fatos.`;
}
// pede um JSON curto para a IA (o mesmo provedor do chat)
async function aiJSON(prompt) {
  if (ai.provider === 'gemini') {
    const model = ai.gLastGood?.fast || ai.gModelFast || PREFERRED_LITE;
    const data = await getJSON(`${gModelUrl(model, 'generateContent')}?${gKeyParam()}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: AbortSignal.timeout(30000),
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', ...thinkingConfigFor(model, 'low') } }),
    });
    return JSON.parse((data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join(''));
  }
  const Anthropic = await getSDK();
  const client = new Anthropic({ apiKey: ai.key, dangerouslyAllowBrowser: true, maxRetries: 1 });
  const msg = await client.messages.create({ model: 'claude-haiku-5-5', max_tokens: 2000, messages: [{ role: 'user', content: prompt + '\n\nResponda só com o JSON, sem texto antes ou depois.' }] });
  const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
  return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
}
// guarda (ou atualiza) o registro da investigação depois de uma resposta boa; nunca atrapalha o chat se falhar
async function rememberInvestigation(question, view, used) {
  if (!view.text || view.error) return;
  const arr = v => (Array.isArray(v) ? v : []).filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, 240)).slice(0, 8);
  try {
    const j = await aiJSON(`Você organiza o que um assistente descobriu sobre o evento "The Hollow" do Roblox. Leia a pergunta, a resposta e as fontes e devolva um JSON em português do Brasil:
{"topic": "assunto em até 6 palavras", "conclusion": "conclusão em 1 ou 2 frases", "facts": ["fatos confirmados pelas fontes"], "hypotheses": ["o que é provável mas não confirmado"], "doubts": ["o que ficou sem resposta"], "recheck": ["o que pode mudar e precisa ser conferido de novo (datas, códigos, missões que ainda não lançaram)"]}
Não invente nada que não esteja na resposta.

PERGUNTA: ${question.slice(0, 400)}
RESPOSTA: ${view.text.slice(0, 6000)}
FONTES: ${view.sources.slice(0, 8).map(s => `${s.title || ''} ${s.url}`).join(' | ') || 'nenhuma'}`);
    const now = Date.now(), g = gameInQuestion(question);
    const rec = {
      q: question.slice(0, 300), game: g?.id || '', topic: String(j.topic || '').slice(0, 80), conclusion: String(j.conclusion || '').slice(0, 500),
      facts: arr(j.facts), hypotheses: arr(j.hypotheses), doubts: arr(j.doubts), recheck: arr(j.recheck),
      sources: view.sources.slice(0, 8).map(s => ({ url: s.url, title: s.title || hostOf(s.url), at: now })), checkedAt: now,
    };
    // a pergunta é continuação de um registro usado: atualiza ele (e conta mais uma conferência)
    const old = used.find(r => r.game === rec.game || relatedMemory(question).includes(r));
    if (old) Object.assign(old, rec, { q: old.q, checks: (old.checks || 1) + 1 });
    else ai.memory.unshift({ id: now.toString(36), at: now, checks: 1, ...rec });
    ai.memory = ai.memory.slice(0, MEM_MAX);
    view.memSaved = old ? 'atualizado' : 'novo';
    saveAi();
    if (ui.view === 'ajuda') { paintChat(); if (ui.memOpen) render(); }
  } catch (e) { console.warn('memória do Oráculo:', e); }
}
function renderMemory() {
  const recs = ai.memory;
  return `<section class="card settings">
    <h2>🧠 Memória de investigação <span class="muted small">(${recs.length}/${MEM_MAX})</span></h2>
    <p class="muted small" style="margin:-6px 0 0">O que o Oráculo já descobriu. Numa pergunta parecida, ele usa esses registros e confere se continuam valendo antes de responder. Fica só neste navegador.</p>
    ${recs.length ? `<div class="gp-row" style="margin:0"><button class="btn danger" data-mem-clear>Apagar toda a memória</button></div>` : ''}
    ${recs.map(r => `<div class="mem-rec">
      <h5>${esc(r.topic || r.q)} ${r.game && byId[r.game] ? `<span class="muted small">· ${esc(byId[r.game].name)}</span>` : ''}</h5>
      <div class="st">Pergunta: "${esc(r.q)}" · conferido ${r.checks || 1}x, a última em ${new Date(r.checkedAt).toLocaleString('pt-BR')}
        ${Date.now() - r.checkedAt > MEM_STALE ? ' · <b style="color:#fcd34d">precisa conferir de novo</b>' : ' · <b style="color:var(--green)">atual</b>'}</div>
      <p style="margin:6px 0"><b>Conclusão:</b> ${esc(r.conclusion)}</p>
      ${[['✅ Fatos confirmados', r.facts], ['🤔 Hipóteses', r.hypotheses], ['❓ Dúvidas', r.doubts], ['🔁 Conferir de novo', r.recheck]].filter(([, l]) => l.length).map(([t, l]) => `<b>${t}</b><ul>${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
      ${r.sources.length ? `<div class="st">Fontes (consultadas em ${new Date(r.sources[0].at).toLocaleDateString('pt-BR')}): ${r.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--orange-2)">${esc(hostOf(s.url))}</a>`).join(' · ')}</div>` : ''}
      <div class="gp-row" style="margin:8px 0 0"><button class="btn" data-mem-ask="${esc(r.id)}">🔁 Conferir de novo</button><button class="btn danger" data-mem-del="${esc(r.id)}">Apagar</button></div>
    </div>`).join('') || '<div class="mk-empty">Nenhum registro ainda. Faça uma pergunta ao Oráculo.</div>'}
  </section>`;
}

function askAI(question) {
  question = question.trim();
  if (!question || aiStream || !hasKey()) return;
  if (looksLikeCode(question)) return toast('🔒 Proteção ativa: o Oráculo não aceita código. Pergunte sobre o evento.');
  return ai.provider === 'gemini' ? askGemini(question) : askClaude(question);
}

/* ----- Claude ----- */
async function askClaude(question) {
  ui.draft = '';
  const input = $('#chatInput');
  if (input) { input.value = ''; input.style.height = ''; }

  const view = { role: 'ai', text: '', thinking: '', steps: [], sources: [], cited: false, status: 'streaming' };
  ai.view.push({ role: 'user', text: question }, view);
  const userMsg = { role: 'user', content: `${progressBlock()}\n\n${question}` };
  const mem = relatedMemory(question), memNote = memoryNote(mem);
  if (mem.length) view.memUsed = mem.length;
  const history = [...ai.msgs, userMsg];
  aiStream = { abort() { this.aborted = true; } };
  refreshChatControls();
  paintChat('bottom');

  let Anthropic;
  try {
    Anthropic = await getSDK();
    const client = new Anthropic({ apiKey: ai.key, dangerouslyAllowBrowser: true, maxRetries: 2 });
    const deep = ai.mode === 'deep';
    let assistantContent = [];
    let baseText = '';

    // o servidor pode pausar pesquisas longas (pause_turn): continuamos até 5 vezes
    for (let round = 0; round < 6; round++) {
      if (aiStream.aborted) throw new Error('aborted');
      const messages = assistantContent.length ? [...history, { role: 'assistant', content: assistantContent }] : history;
      const stream = client.beta.messages.stream({
        model: 'claude-opus-5-5',
        max_tokens: 64000,
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        thinking: { type: 'adaptive', display: 'summarized' },
        output_config: { effort: deep ? 'high' : 'low' },
        system: SYSTEM() + NO_CODE_NOTE + eventFacts() + memNote,
        tools: [
          { type: 'web_search_20260209', name: 'web_search', max_uses: deep ? 15 : 4 },
          { type: 'web_fetch_20260209', name: 'web_fetch', max_uses: deep ? 8 : 2 },
        ],
        messages,
      });
      const prevAbort = aiStream.aborted;
      aiStream = stream;
      if (prevAbort) stream.abort();

      const partial = {}, stepAt = {};
      for await (const ev of stream) {
        if (ev.type === 'content_block_start') {
          const b = ev.content_block;
          if (b.type === 'server_tool_use') {
            const step = { label: b.name === 'web_fetch' ? '📄 Lendo página...' : '🔎 Pesquisando...', live: true, name: b.name };
            view.steps.push(step);
            stepAt[ev.index] = step;
            partial[ev.index] = '';
          } else if (b.type === 'web_search_tool_result') {
            view.steps.forEach(s => { if (s.name === 'web_search') s.live = false; });
            if (Array.isArray(b.content)) {
              for (const r of b.content) if (r.url && !view.sources.some(s => s.url === r.url)) view.sources.push({ url: r.url, title: r.title });
            }
          } else if (b.type === 'web_fetch_tool_result') {
            view.steps.forEach(s => { if (s.name === 'web_fetch') s.live = false; });
          }
        } else if (ev.type === 'content_block_delta') {
          const d = ev.delta;
          if (d.type === 'text_delta') view.text += d.text;
          else if (d.type === 'thinking_delta') view.thinking += d.thinking;
          else if (d.type === 'input_json_delta' && stepAt[ev.index]) {
            partial[ev.index] += d.partial_json;
            const q = partial[ev.index].match(/"(query|url)"\s*:\s*"((?:[^"\\]|\\.)*)/);
            if (q) stepAt[ev.index].label = (q[1] === 'url' ? '📄 ' + hostOf(q[2]) : '🔎 ' + q[2]);
          }
        }
        paintChat();
      }

      const final = await stream.finalMessage();
      assistantContent = [...assistantContent, ...final.content];
      view.steps.forEach(s => s.live = false);

      // texto final (corrige o que foi mostrado caso tenha havido troca de modelo no meio)
      const textBlocks = final.content.filter(b => b.type === 'text');
      baseText += textBlocks.map(b => b.text).join('');
      view.text = baseText;
      const cited = [];
      for (const b of textBlocks) for (const c of b.citations || []) {
        if (c.url && !cited.some(s => s.url === c.url)) cited.push({ url: c.url, title: c.title });
      }
      if (cited.length) { view.sources = cited; view.cited = true; }

      if (final.stop_reason === 'pause_turn') continue;
      if (final.stop_reason === 'refusal') {
        view.error = 'O Oráculo não pôde responder essa pergunta. Tente reformular.';
        assistantContent = null;
      } else if (final.stop_reason === 'max_tokens') {
        view.error = 'A resposta ficou longa demais e foi cortada.';
      }
      break;
    }

    if (assistantContent) { ai.msgs = [...history, { role: 'assistant', content: assistantContent }]; rememberInvestigation(question, view, mem); }
  } catch (err) {
    const aborted = aiStream?.aborted || aiStream?.controller?.signal?.aborted || (Anthropic && err instanceof Anthropic.APIUserAbortError) || err?.message === 'aborted';
    view.error = aborted ? 'Resposta interrompida.' : Anthropic ? errorText(Anthropic, err) : err?.message || String(err);
    view.steps.forEach(s => s.live = false);
  } finally {
    view.status = 'done';
    aiStream = null;
    saveAi();
    refreshChatControls();
    paintChat();
  }
}

/* ---------- actions ---------- */
function toggle(id, ev) {
  const g = byId[id];
  if (!g) return;
  const was = !!state.done[id];
  const prev = pct(totals().mainDone, totals().main.length);
  state.done[id] = !was;
  if (!was) state.doneAt[id] = Date.now(); else delete state.doneAt[id];
  save();
  render();
  if (!was) {
    const t = totals();
    if (ev) burst(ev.clientX, ev.clientY);
    if (g.type === 'main' && t.mainDone === t.main.length && prev < 100) toast('🏆 Todos os jogos principais concluídos!');
    else if (t.scopedDone === t.scoped.length) toast('🎉 Você completou o evento inteiro!');
    else toast(`✅ ${g.name} concluído! Progresso: ${pct(t.scopedDone, t.scoped.length)}%`);
  } else {
    toast(`↩️ ${g.name} voltou para pendente`);
  }
}

function burst(x, y, em = ['🎃', '✨', '🦇', '👻', '🍬'], n = 12) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = em[i % em.length];
    const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 70;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(a) * r + 'px');
    s.style.setProperty('--dy', Math.sin(a) * r + 'px');
    s.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ----- página do jogo (estilo Roblox): Sobre, Emblemas e Marcações ----- */
// GAME_DATA vem do games-data.js (cópia baixada do Roblox); live = números atualizados agora pelo RoProxy
const live = {};
// alguns jogos criaram os emblemas do evento antes de outubro (ex.: o Solar Requiem do Tower Defense, em 22/09)
const EVENT_START = EVENT_BADGES_SINCE;
const fmtN = n => n == null ? '—' : new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
const fmtD = s => s ? new Date(s).toLocaleDateString('pt-BR') : '—';

function gameData(id) {
  const base = (typeof GAME_DATA !== 'undefined' && GAME_DATA[id]) || null;
  const d = base && live[id] ? { ...base, ...live[id] } : base;
  const more = tracked.byGame[id];
  if (!d || !more?.length) return d;
  const have = new Set((d.badges || []).map(b => String(b.id)));
  const add = more.filter(b => !have.has(String(b.id)));
  return add.length ? { ...d, badges: [...(d.badges || []), ...add] } : d;
}

// emblemas confirmados por quem jogou. O Children of The Hollow (Mimic) foi criado antes do Halloween, então o app não
// olhava a moldura dele; o Ken Carson xperiment USB Chain é o emblema do The Block, o jogo secreto da missão
const KNOWN_EVENT_BADGES = new Set(['1614932857309915', '584160746904123', '4331072428094851']); // + The Block KC Event (Blade Ball)
// não são emblema do evento do próprio jogo: o USB OBTAINED (Mimic) é só uma parte secreta do emblema do The Block
const NOT_EVENT_BADGES = new Set(['3553430951284733']);
// emblema do evento com certeza: está no rastreador (Gunterverse), tem a moldura do The Hollow ou veio de um jogo extra
const isEventBadge = (d, b) => d?.onlyBadges ? d.onlyBadges.includes(String(b.id)) : !NOT_EVENT_BADGES.has(String(b.id)) && (KNOWN_EVENT_BADGES.has(String(b.id)) || tracked.ids.has(String(b.id)) || frameSeen[b.id] === 1 || (d?.hollowBadges || []).map(String).includes(String(b.id)));
// os do evento vêm primeiro (mesmo os criados antes do Halloween, que o jogo reaproveitou); depois os mais ganhos por dia
function eventBadges(d) {
  return (d?.badges || []).filter(b => isEventBadge(d, b) || !d.onlyBadges && Date.parse(b.created) >= EVENT_START && !NOT_EVENT_BADGES.has(String(b.id)))
    .sort((a, b) => isEventBadge(d, b) - isEventBadge(d, a) || (b.day || 0) - (a.day || 0)).slice(0, 5);
}
// descendência: de que jogo (universeId) cada emblema vem, segundo o próprio Roblox (awardingUniverse) ou o Gunterverse.
// Um emblema que não é reconhecido como do evento mas vem de um jogo do evento vira "emblema do jogo" em vez de "provável"
const DESCENT_KEY = 'hollow-descent-v1';
let descent = {};
try { descent = JSON.parse(localStorage.getItem(DESCENT_KEY)) || {}; } catch {}
const saveDescent = () => { try { localStorage.setItem(DESCENT_KEY, JSON.stringify(descent)); } catch {} };
const isGameBadge = (d, b) => !!d?.universeId && String(descent[b.id]) === String(d.universeId);
// só os emblemas do evento de verdade; se nenhum foi reconhecido no jogo, os prováveis de antes
function hollowBadgesOf(d) {
  const sure = (d?.badges || []).filter(b => isEventBadge(d, b));
  return sure.length ? sure : eventBadges(d);
}

// o que a moldura já disse de cada emblema (1 = do evento, 0 = não); o ícone não muda, então fica guardado
const FRAME_KEY = 'hollow-frames-v1';
let frameSeen = {};
try { frameSeen = JSON.parse(localStorage.getItem(FRAME_KEY)) || {}; } catch {}
// olha a moldura dos emblemas do Halloween de todos os jogos que ainda não foram olhados
async function scanFrames(onProgress) {
  const todo = [];
  for (const g of [...GAMES, HUB]) for (const b of gameData(g.id)?.badges || [])
    if (Date.parse(b.created) >= EVENT_START && b.icon && !(b.id in frameSeen)) todo.push(b);
  if (!todo.length) return;
  const isHollow = await hollowFrame();
  await inPool(todo, 6, async b => {
    try { frameSeen[b.id] = isHollow(await iconPixels(b.icon)) ? 1 : 0; } catch {}
    onProgress?.(todo.length);
  });
  try { localStorage.setItem(FRAME_KEY, JSON.stringify(frameSeen)); } catch {}
}

// confere na conta do Roblox `rid` quais destes emblemas ela tem (cada item é [qualquer coisa, id do emblema]).
// Chama onOwned(item) para os que ela tem e onChecked() a cada um conferido. Devolve quantos não puderam ser conferidos
// e, se o servidor deu erro, o motivo (o que já foi conferido continua valendo).
async function robloxOwned(rid, pending, onOwned, onChecked) {
  const PRIVATE = 'Seu inventário do Roblox está privado. No Roblox, vá em Configurações → Privacidade → "Quem pode ver meu inventário?" e escolha "Todos". Depois tente de novo.';
  let failed = 0, stuck = 0, serverError = '';
  // inventário privado: o Roblox responde "não tem" para tudo, então avisa antes de conferir
  const cv = await fetch(`https://inventory.roproxy.com/v1/users/${rid}/can-view-inventory?_=${Date.now()}`, { cache: 'no-store', signal: AbortSignal.timeout(8000) })
    .then(r => r.ok ? r.json() : null).catch(() => null);
  if (cv?.canView === false) throw new Error(PRIVATE);

  // Dois caminhos ao mesmo tempo, cada um com o seu próprio limite no Roblox (pedir em paralelo pelo
  // mesmo caminho só estoura o limite mais rápido):
  //  - RoProxy, pelo navegador: um emblema por vez, do começo da fila
  //  - servidor do Supabase: lotes de 10, do fim da fila
  // Se o RoProxy pedir calma (429), o emblema vai para o servidor em vez de ficar esperando.
  const toServer = [];
  let proxyDone = false, privateInv = false;
  const proxyWorker = async () => {
    let pause = 0, limited = 0;
    while (pending.length && !privateInv && limited < 3) {
      if (pause) { await sleep(pause); pause = 0; }
      const item = pending.shift();
      try {
        const r = await fetch(`https://inventory.roproxy.com/v1/users/${rid}/items/2/${item[1]}/is-owned?_=${Date.now()}`, { cache: 'no-store', signal: AbortSignal.timeout(8000) });
        if (!r.ok) throw new Error(r.status);
        if ((await r.text()).trim() === 'true') onOwned(item);
        onChecked();
        limited = 0;
      } catch (e) {
        toServer.push(item);
        // o RoProxy bloqueou (429 seguidos): desiste dele nesta conferência e deixa o resto com o servidor
        if (String(e.message) === '429') { pause = 1500; limited++; }
      }
    }
    proxyDone = true;
  };
  const serverWorker = async () => {
    for (;;) {
      const batch = toServer.splice(0, 10);
      if (batch.length < 10) batch.push(...pending.splice(-(10 - batch.length)));
      if (!batch.length) { if (proxyDone) break; await sleep(300); continue; }
      const { data, error } = await sb.rpc('roblox_check_badges', { p_badges: batch.map(x => x[1]) });
      // servidor com erro: para o servidor; o RoProxy continua com o que falta, e o resto conta como não conferido
      if (error) { serverError = sbErr(error); toServer.unshift(...batch); break; }
      if (data.private) { privateInv = true; throw new Error(PRIVATE); }
      const checked = new Set((data.checked || []).map(String)), owned = new Set((data.owned || []).map(String));
      failed += (data.failed || []).length;
      for (const item of batch) if (checked.has(String(item[1]))) { if (owned.has(String(item[1]))) onOwned(item); onChecked(); }
      const left = batch.filter(x => !checked.has(String(x[1])));
      toServer.unshift(...left);
      // o Roblox limitou o servidor: espera um pouco; depois de várias vezes seguidas, desiste do que sobrou
      if (left.length === batch.length) {
        if (++stuck > 8) { failed += toServer.length + pending.length; toServer.length = 0; pending.length = 0; break; }
        await sleep(4000);
      } else stuck = 0;
    }
  };
  await Promise.all([proxyWorker(), serverWorker()]);
  failed += toServer.length + pending.length;
  return { failed, note: serverError ? ` (servidor: ${serverError})` : '' };
}

// confere no Roblox (pelo servidor, na conta verificada) quais emblemas do evento a pessoa já tem
// auto: chamada pelo Piloto automático (sem perguntas: marca os jogos sozinha e devolve o que achou)
async function checkRobloxBadges(onlyGame, auto) {
  if (!sb || !acct.profile?.roblox_id) return auto ? null : toast('⚠️ Ligue sua conta do Roblox em Minha conta primeiro.');
  if (acct.checking) return null;
  const newly = [];
  // 1. emblemas do evento que o Gunterverse lista e os emblemas novos de cada jogo (ex.: o do Demonology que saiu depois)
  //    sempre busca de novo em todos os jogos (sem cópia guardada), para nenhum emblema novo do evento ficar de fora
  acct.checking = { done: 0, total: 0, step: 'Procurando emblemas novos nos jogos...' }; render();
  const scope = [...GAMES, HUB].filter(g => (!onlyGame || g.id === onlyGame) && gameData(g.id));
  const idsNow = () => new Set(scope.flatMap(g => (gameData(g.id)?.badges || []).map(b => String(b.id))));
  const before = idsNow();
  await trackEvent();
  acct.checking.total = scope.length;
  await inPool(scope, 3, async g => { await refreshBadges(g.id); acct.checking.done++; render(); });
  const newBadges = scope.flatMap(g => (gameData(g.id)?.badges || []).filter(b => !before.has(String(b.id)) && Date.parse(b.created) >= EVENT_START).map(b => `${b.name} (${g.name})`));
  // 2. a moldura do The Hollow nos emblemas do Halloween que ainda não foram olhados
  acct.checking = { done: 0, total: 0, step: 'Reconhecendo os emblemas do evento...' }; render();
  try { await scanFrames(total => { acct.checking.total = total; acct.checking.done++; render(); }); }
  catch (e) { console.warn('moldura:', e); } // sem a moldura, confere os do rastreador e os prováveis
  acct.checking = null;
  const all = [];
  for (const g of [...GAMES, HUB]) if (!onlyGame || g.id === onlyGame) for (const b of hollowBadgesOf(gameData(g.id) || {})) all.push([g.id, b.id]);
  // o emblema do item do puzzle final (The Hollow Skull) ainda não está nos dados baixados do hub
  if ((!onlyGame || onlyGame === 'hub') && !all.some(([, bid]) => String(bid) === SKULL.badge)) all.push(['hub', SKULL.badge]);
  if (!all.length) return auto ? null : toast('Este jogo não tem emblemas do evento para conferir.');
  const rid = acct.profile.roblox_id; // sempre a conta do Roblox verificada
  let found = 0, failed = 0;
  const mark = (gid, bid) => { const own = state.badges[gid] ||= {}; if (!own[bid]) { own[bid] = Date.now(); found++; newly.push([gid, bid]); } };
  // os que já estão marcados como "já tenho" não precisam ser conferidos de novo
  const pending = all.filter(([gid, bid]) => !state.badges[gid]?.[bid]);
  if (!pending.length) return auto ? { newly, games: [], failed: 0 } : toast('✅ Você já tem todos esses emblemas marcados.');
  acct.checking = { done: all.length - pending.length, total: all.length }; render();
  let lastPaint = 0;
  const progress = () => { acct.checking.done++; if (Date.now() - lastPaint > 250) { lastPaint = Date.now(); render(); } };
  try {
    const res = await robloxOwned(rid, pending, item => mark(...item), progress);
    failed = res.failed;
    save();
    // acabou de ganhar o item do puzzle final: comemoração especial
    if (pending.some(([, bid]) => String(bid) === SKULL.badge) && state.badges.hub?.[SKULL.badge]) setTimeout(skullCelebrate, 600);
    // descendência dos emblemas que a pessoa tem: os que não são reconhecidos como do evento são conferidos no
    // Roblox (de que jogo vêm); se vierem de um jogo do evento, passam de "provável" para "emblema do jogo"
    const unsure = all.filter(([gid, bid]) => state.badges[gid]?.[bid] && !(bid in descent) && !isEventBadge(gameData(gid), { id: bid }));
    if (unsure.length) {
      acct.checking = { done: 0, total: unsure.length, step: 'Conferindo de que jogo vem cada emblema...' }; render();
      await inPool(unsure, 4, async ([, bid]) => {
        const j = await fetch(`https://badges.roproxy.com/v1/badges/${bid}`, { signal: AbortSignal.timeout(8000) }).then(r => r.ok ? r.json() : null).catch(() => null);
        if (j?.awardingUniverse?.id) descent[bid] = j.awardingUniverse.id;
        acct.checking.done++; render();
      });
      saveDescent();
    }
    const fresh = newBadges.length ? ` 🆕 Emblema(s) novo(s) nos jogos: ${newBadges.slice(0, 3).join(', ')}${newBadges.length > 3 ? ` e mais ${newBadges.length - 3}` : ''}.` : '';
    const fails = failed ? ` ⚠️ ${failed} emblema(s) não puderam ser conferidos agora${res.note}; tente de novo em alguns minutos.` : '';
    if (!auto) toast(found ? `🏅 ${found} emblema(s) novo(s) encontrado(s) e marcado(s)!${fresh}${fails}` : failed ? `⚠️ Não consegui conferir ${failed} de ${all.length} emblemas${res.note || ' (o Roblox recusou)'}. Tente de novo em alguns minutos.${fresh}` : `🔎 Conferido! Nenhum emblema novo do evento na sua conta.${fresh}`);
    // tem o provável emblema do evento mas o jogo ainda está pendente: oferece marcar como concluído
    const toMark = GAMES.filter(g => (!onlyGame || g.id === onlyGame) && !state.done[g.id] && (() => {
      const d = gameData(g.id) || {}, sure = (d.badges || []).filter(b => isEventBadge(d, b)), top = eventBadges(d)[0];
      return sure.length ? sure.some(b => state.badges[g.id]?.[b.id]) : top && state.badges[g.id]?.[top.id];
    })());
    // o piloto marca sozinho (só jogos com emblema do evento que a pessoa ganhou agora ou antes)
    if (auto) {
      for (const g of toMark) { state.done[g.id] = true; state.doneAt[g.id] = Date.now(); }
      save();
      return { newly, games: toMark, failed };
    }
    if (toMark.length && confirm(`Você já tem o emblema do evento em: ${toMark.map(g => g.name).join(', ')}.\n\nMarcar ${toMark.length > 1 ? 'esses jogos' : 'esse jogo'} como concluído?`)) {
      for (const g of toMark) { state.done[g.id] = true; state.doneAt[g.id] = Date.now(); }
      save();
    }
  } catch (e) {
    save();
    if (!auto) toast('⚠️ ' + sbErr(e));
    else return { newly, games: [], failed: 0, error: sbErr(e) };
  } finally {
    acct.checking = null;
    render();
  }
}

// botão de conferir emblemas (na conta e na aba Marcações)
function badgeCheckBtn(onlyGame) {

/* ----- jogos extras: achados pelo botão de Dev "Adicionar jogos com base nas badges do The Hollow" ----- */
// ficam na tabela extra_games do Supabase (todos veem, só Dev adiciona) e entram na lista como jogos secundários
function addGame(row) {
  if (byId[row.id]) return;
  const g = { id: row.id, name: row.name, icon: '🎃', type: 'sec', c: ['#3a1a0c', '#120804'], img: row.data?.icon, extra: true };
  // em ordem alfabética entre os secundários
  const at = GAMES.findIndex(x => x.type === 'sec' && x.name.localeCompare(g.name, 'pt-BR') > 0);
  GAMES.splice(at < 0 ? GAMES.length : at, 0, g);
  byId[g.id] = g;
  if (typeof GAME_DATA !== 'undefined') GAME_DATA[g.id] = row.data;
  const n = normText(g.name);
  GAME_KEYS.push({ g, keys: [...new Set([n, n.replace(/^the /, '')])].filter(k => k.length >= 3) });
}

async function loadExtraGames() {
  if (!sb) return;
  const { data, error } = await sb.from('extra_games').select('id, name, data').order('created_at');
  if (error) return console.warn('jogos extras:', error.message);
  data.forEach(addGame);
  if (data.length) render();
}

// Rastreamento do evento: de tempos em tempos o app procura jogos e emblemas NOVOS (não marca nada) em várias fontes:
//  - Gunterverse (gunterverse.com/events/the-hollow): a lista de jogos e emblemas do evento, lida pelo servidor (cópia de 10 min)
//  - fontes confiáveis (Roblox Wiki, thehollowroblox.com...): páginas que listam os jogos com links do Roblox, lidas pelo servidor.
//    Pesquisar no Google a cada 30 s não é possível (o Google bloqueia e as APIs de pesquisa têm cota de ~1.000 por mês).
//  - jogos extras que o Dev adicionou (em outro aparelho, por exemplo): entram na lista na hora
//  - uma versão nova do app com jogos novos na lista: avisa e oferece atualizar
// Cada verificação fica no histórico do painel "Rastreamento do evento" (aba Evento), que é a prova de que ele rodou.
const NEW_GAMES_EVERY = 30; // segundos
const TRACK_KEY = 'hollow-track-v1';
// jogos que o Gunterverse lista mas foram tirados do app de propósito
const REMOVED_UNIVERSES = { 4523856444: 'Color or Die', 6739698191: 'Violence District' };
let newGames = []; // jogos da versão nova do app que ainda não estão nesta tela
let tracked = { ids: new Set(), byGame: {}, missing: [], src: null, sources: null, at: 0, next: 0, running: false, promise: null };
let trackLog = [];
try { trackLog = JSON.parse(localStorage.getItem(TRACK_KEY)) || []; } catch {}

// quem chama durante uma verificação em andamento espera ela terminar (a conferência precisa dos emblemas do Gunterverse)
function trackEvent() {
  return tracked.promise ||= runTrack().finally(() => { tracked.promise = null; });
}
async function runTrack() {
  tracked.running = true;
  paintTrack();
  const entry = { at: Date.now(), found: [] };
  try {
    // 1. jogos extras do Dev (antes das fontes, para um jogo recém-adicionado não aparecer como "fora do app")
    if (sb) {
      const { data } = await sb.from('extra_games').select('id, name, data').order('created_at');
      for (const r of data || []) if (!byId[r.id]) { addGame(r); entry.found.push(`${r.name} (adicionado pelo Dev)`); }
    }
    // 2. Gunterverse e fontes confiáveis, pelo servidor
    if (sb) {
      const { data, error } = await sb.rpc('event_tracker', { p_force: false });
      if (error) entry.gv = { error: sbErr(error) };
      else {
        tracked.src = data;
        entry.gv = { games: data.games.length, badges: data.badge_count, fetched: data.fetched_at, error: data.error };
        const uni = {};
        for (const g of [...GAMES, HUB]) { const u = gameData(g.id)?.universeId; if (u && !g.alias) uni[u] = g.id; }
        const before = tracked.ids.size;
        tracked.ids = new Set(data.badges.map(b => String(b.id)));
        tracked.byGame = {};
        for (const b of data.badges) {
          if (b.universe) descent[b.id] = b.universe;
          if (uni[b.universe])
            (tracked.byGame[uni[b.universe]] ||= []).push({ id: b.id, name: b.name, desc: b.desc, created: b.created, icon: b.icon });
        }
        saveDescent();
        if (before && tracked.ids.size > before) entry.found.push(`${tracked.ids.size - before} emblema(s) novo(s) do evento`);
      }
      // fontes confiáveis
      const { data: srcs, error: e3 } = await sb.rpc('event_sources_check');
      if (e3) entry.srcError = sbErr(e3);
      else {
        tracked.sources = srcs;
        entry.srcs = srcs.map(x => ({ name: x.name, games: x.games.length, error: x.error }));
      }
      // jogos que alguma fonte lista e não estão no app (cada um com as fontes que citam)
      const uni = {};
      for (const g of [...GAMES, HUB]) { const u = gameData(g.id)?.universeId; if (u && !g.alias) uni[u] = g.id; }
      const out = {};
      const add = (u, name, from) => {
        if (!u || uni[u] || REMOVED_UNIVERSES[u]) return;
        const m = out[u] ||= { u, name: '', from: [] };
        if (name && !m.name) m.name = cleanGameName(name);
        if (!m.from.includes(from)) m.from.push(from);
      };
      const gvNames = {};
      for (const b of tracked.src?.badges || []) if (b.universe_name) gvNames[b.universe] = b.universe_name;
      for (const u of tracked.src?.games || []) add(u, gvNames[u], 'Gunterverse');
      for (const x of tracked.sources || []) for (const g of x.games) add(g.universe, g.name, x.name);
      const missing = Object.values(out).map(m => ({ ...m, name: m.name || `jogo ${m.u}` }));
      const fresh = missing.filter(m => !tracked.missing.some(x => x.u === m.u));
      if (tracked.at) entry.found.push(...fresh.map(m => `${m.name} (em ${m.from.join(', ')}, fora do app)`));
      tracked.missing = missing;
    }
    // 3. aviso para todos (Admin e Dev), site desligado e advertências
    await loadNotice();
    await loadSiteStatus();
    await loadMyWarnings();
    // 4. versão nova do app
    if (location.protocol.startsWith('http')) {
      const html = await fetch('index.html', { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '');
      const list = html.match(/const GAMES = \[([\s\S]*?)\n\];/)?.[1] || '';
      const found = [...list.matchAll(/id: '([^']+)',\s*name: (['"])(.*?)\2,.*?type: '(main|sec)'/g)]
        .filter(m => !byId[m[1]]).map(m => ({ id: m[1], name: m[3], type: m[4] }));
      entry.found.push(...found.filter(g => !newGames.some(x => x.id === g.id)).map(g => `${g.name} (versão nova do app)`));
      newGames = found;
      entry.version = true;
    }
  } catch (e) {
    entry.error = sbErr(e);
  } finally {
    tracked.running = false;
    tracked.at = entry.at;
    tracked.next = Date.now() + NEW_GAMES_EVERY * 1000;
    trackLog = [entry, ...trackLog].slice(0, 12);
    try { localStorage.setItem(TRACK_KEY, JSON.stringify(trackLog)); } catch {}
  }
  if (entry.found.length) toast(`🆕 ${entry.found.join(' · ')}`);
  // só redesenha nas telas de lista: em outras telas o usuário pode estar digitando
  if (entry.found.length && ['home', 'main', 'sec', 'board'].includes(ui.view)) render();
  else paintTrack();
}

/* ----- Saúde: aviso depois de muitas horas seguidas ----- */
// O app não sabe quanto tempo você passa dentro do Roblox; ele conta o tempo em que você está usando o app (janela
// aberta e mexendo nela nos últimos 5 minutos). Uma pausa de 30 minutos zera a sessão. Ninguém é bloqueado: depois de
// muitas horas seguidas aparece um aviso na tela, que a pessoa fecha concordando ou dizendo que não está bem.
// O Dev não recebe o aviso (ele passa horas no app desenvolvendo).
const HEALTH_KEY = 'hollow-health-v1';
const H_MAX = 6 * 36e5;       // 6 horas seguidas
const H_NIGHT = 3 * 36e5;     // 3 horas seguidas entre 1h e 6h da manhã = virando a noite
const H_WARN = 4 * 36e5;      // lembrete gentil (só um aviso rápido) a partir de 4 horas
const H_AGAIN = 2 * 36e5;     // depois de concordar, o aviso volta só depois de mais 2 horas
let health = { days: {}, contStart: 0, lastActive: 0, warned: 0, agreedAt: 0 };
try { Object.assign(health, JSON.parse(localStorage.getItem(HEALTH_KEY)) || {}); } catch {}
const saveHealth = () => { try { localStorage.setItem(HEALTH_KEY, JSON.stringify(health)); } catch {} };
let lastInput = Date.now();
for (const ev of ['pointerdown', 'keydown', 'wheel', 'touchstart']) addEventListener(ev, () => { lastInput = Date.now(); }, { passive: true, capture: true });
const dayKey = t => new Date(t).toLocaleDateString('sv'); // 2026-10-25
const hm = ms => `${Math.floor(ms / 36e5)}h ${pad2(Math.floor(ms / 6e4) % 60)}min`;
const healthExempt = () => !!sb && rank() === 4;
const isNight = () => { const h = new Date().getHours(); return h >= 1 && h < 6; };

function healthTick() {
  const now = Date.now();
  if (document.hidden || now - lastInput > 5 * 6e4) return;
  // voltou depois de 30 minutos parado: sessão nova
  if (!health.contStart || now - health.lastActive > 30 * 6e4) health.contStart = now;
  const step = health.lastActive && now - health.lastActive < 3 * 6e4 ? now - health.lastActive : 6e4;
  health.days[dayKey(now)] = (health.days[dayKey(now)] || 0) + step;
  health.lastActive = now;
  // guarda só os últimos 14 dias
  for (const k of Object.keys(health.days).sort().slice(0, -14)) delete health.days[k];
  saveHealth();
  if (healthExempt()) return;
  const cont = now - health.contStart, night = isNight();
  if ((cont >= H_MAX || (night && cont >= H_NIGHT)) && now - health.agreedAt > H_AGAIN) showHealthWarning(night ? 'night' : 'long', cont);
  else if (cont >= H_WARN && now - health.warned > 30 * 6e4) {
    health.warned = now; saveHealth();
    toast(`💤 Você está há ${hm(cont)} seguidas no app. Que tal levantar, beber água e descansar um pouco?`);
  }
}
setInterval(healthTick, 6e4);

// aviso por cima da tela: "entendo e concordo" fecha; "não estou me sentindo bem" mostra onde buscar ajuda
function showHealthWarning(why, cont) {
  const el = $('#restScreen');
  if (!el || el.classList.contains('on')) return;
  el.classList.add('on');
  el.innerHTML = `<div class="ov-box">
    <div class="big">🌙</div>
    <h2>Hora de cuidar de você</h2>
    <p>${why === 'night' ? `Você está há <b>${hm(cont)}</b> seguidas no app, e já é madrugada.` : `Você está há <b>${hm(cont)}</b> seguidas no app.`}
      Ficar muitas horas sem dormir, comer ou descansar faz mal. Considere fazer uma pausa.</p>
    <div class="gp-row" style="justify-content:center;flex-direction:column;gap:10px;margin-top:16px">
      <button class="btn primary" data-health="agree">Entendo e concordo que, caso aconteça algo comigo, o programa não tem culpa</button>
      <button class="btn danger" data-health="unwell">Não estou me sentindo bem</button>
    </div>
  </div>`;
}
function healthAction(a) {
  const el = $('#restScreen');
  if (a === 'agree') { health.agreedAt = Date.now(); saveHealth(); el.classList.remove('on'); el.innerHTML = ''; return; }
  if (a === 'unwell') {
    el.innerHTML = `<div class="ov-box">
      <div class="big">💜</div>
      <h2>Você não está sozinho</h2>
      <p>Pare um pouco: levante, beba água, coma algo e, se for tarde, tente dormir. Seu progresso está salvo e o evento espera por você.</p>
      <p>Se não estiver bem, fale agora com alguém de confiança (família, amigos).</p>
      <p class="small">No Brasil:<br>💬 <b>CVV — 188</b> (ligação grátis, 24 horas) ou <a href="https://cvv.org.br" target="_blank" rel="noopener" style="color:var(--orange-2)">cvv.org.br</a> (chat)<br>
        🚑 <b>SAMU — 192</b> em caso de emergência de saúde</p>
      <div class="gp-row" style="justify-content:center;margin-top:14px"><button class="btn" data-health="close">Fechar</button></div>
    </div>`;
    return;
  }
  if (a === 'close') { health.agreedAt = Date.now(); saveHealth(); el.classList.remove('on'); el.innerHTML = ''; }
}

function renderHealth() {
  const now = Date.now(), today = health.days[dayKey(now)] || 0;
  const cont = health.contStart && now - health.lastActive < 30 * 6e4 ? now - health.contStart : 0;
  const days = Array.from({ length: 7 }, (_, i) => { const t = now - (6 - i) * 864e5; return { k: dayKey(t), l: new Date(t).toLocaleDateString('pt-BR', { weekday: 'short' }) }; });
  const max = Math.max(36e5, ...days.map(d => health.days[d.k] || 0));
  return `
  <section class="card settings">
    <h2>${icon('i-heart')} Sua saúde</h2>
    <p class="muted small" style="margin:-6px 0 0">O app conta o tempo em que você está usando ele (não o tempo dentro do Roblox, que o app não consegue ver).
      Depois de <b>6 horas seguidas</b>, ou <b>3 horas seguidas de madrugada</b> (entre 1h e 6h), aparece um aviso na tela. Ninguém é bloqueado.
      Ficar 30 minutos sem usar o app zera a sessão.${healthExempt() ? ' <b>Como Dev, você não recebe o aviso.</b>' : ''}</p>
    <div class="set-row"><div><h4>Hoje</h4><p>${hm(today)} usando o app</p></div><div><h4>Sessão agora</h4><p>${hm(cont)} seguidas${cont >= H_WARN ? ' · ⚠️ hora de uma pausa' : ''}</p></div>
      <div><h4>Aviso em</h4><p>${healthExempt() ? '— (Dev)' : cont ? hm(Math.max(0, (isNight() ? H_NIGHT : H_MAX) - cont)) : '—'}</p></div></div>
    <div><h4 style="margin:0">Últimos 7 dias</h4>
      <div class="h-bars">${days.map(d => `<div><span>${(health.days[d.k] || 0) >= 36e5 ? Math.round((health.days[d.k] || 0) / 36e5) + 'h' : Math.round((health.days[d.k] || 0) / 6e4) + 'min'}</span><i style="height:${Math.round((health.days[d.k] || 0) / max * 100)}%"></i>${esc(d.l)}</div>`).join('')}</div></div>
    <div class="set-row">
      <div><h4>Não está se sentindo bem?</h4><p>Veja onde buscar ajuda agora. Se for algo sério, converse com alguém de confiança ou ligue para o CVV: <b>188</b> (grátis, 24 horas).</p></div>
      <button class="btn danger" data-health-open>💜 Não estou me sentindo bem</button>
    </div>
  </section>`;
}

/* ----- Autodiagnóstico: o app confere a própria saúde ----- */
// cada item: ok | warn | bad, o que foi visto e, se der, uma correção. Correções que mudam dados fazem backup antes.
const BACKUP_KEY = 'hollow-backup-auto';
let diag = { running: false, at: 0, items: [] };
function autoBackup(reason) {
  const b = { at: Date.now(), reason, state: JSON.parse(JSON.stringify(state)) };
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(b)); } catch {}
  download(); // e uma cópia em arquivo
  return b;

const lastBackup = () => { try { return JSON.parse(localStorage.getItem(BACKUP_KEY)); } catch { return null; } };

    const [dd, mm, yy] = (typeof GAME_DATA_DATE !== 'undefined' ? GAME_DATA_DATE : '').split('/').map(Number);
    const age = yy ? (Date.now() - new Date(yy, mm - 1, dd)) / 864e5 : 99;
    add('Dados', age > 2 ? 'warn' : 'ok', 'Cópia dos dados do Roblox', yy ? `Baixada em ${GAME_DATA_DATE}${age > 2 ? ` (há ${Math.floor(age)} dias). Rode tools/atualizar-dados.ps1 para baixar de novo.` : '.'}` : 'games-data.js não carregou.');
    const orphans = ['done', 'doneAt', 'notes', 'badges', 'checks'].flatMap(k => Object.keys(state[k]).filter(id => !byId[id]).map(id => `${k}.${id}`));
    add('Dados', orphans.length ? 'warn' : 'ok', 'Progresso de jogos que saíram da lista', orphans.length ? `${orphans.length} registro(s) de jogos que não estão mais no app (${[...new Set(orphans.map(o => o.split('.')[1]))].join(', ')}).` : 'Nenhum.',
      orphans.length ? [{ label: 'Limpar esses registros', run: 'orphans' }] : null);
    // 5. Oráculo
    const answers = ai.view.filter(m => m.role === 'ai'), fails = answers.slice(-20).filter(m => m.error);
    add('Oráculo', hasKey() ? 'ok' : 'bad', 'Chave da IA', hasKey() ? `${ai.provider === 'gemini' ? 'Gemini' : 'Claude'} configurado.` : 'Sem chave: o Oráculo não responde. Cole a chave em Configurações.');

      answers.length ? `${answers.length} resposta(s) nesta conversa, ${fails.length} com erro nas últimas 20${fails.length ? ` (última: ${fails.at(-1).error.slice(0, 120)})` : ''}.` : 'Nenhuma pergunta ainda nesta conversa.');

// correções: as que mudam o progresso fazem backup antes (arquivo + cópia no navegador) e pedem confirmação
// quem pode ver o Diagnóstico (Admin e Dev) e quem pode corrigir (só Dev); sem contas ligadas, o próprio usuário
const diagCanSee = () => !sb || rank() >= 3;
const diagCanFix = () => !sb || rank() === 4;
async function diagFix(run) {
  if (!diagCanFix()) return toast('🔒 Só o Dev pode fazer correções. Admin vê o diagnóstico sem mudar nada.');
  const ask = msg => confirm(`${msg}\n\nAntes, o app faz um backup do seu progresso (arquivo e cópia no navegador), que dá para recuperar depois aqui no Diagnóstico.`);
  if (run === 'push') { if (!ask('Enviar o progresso DESTE aparelho para a nuvem? O da nuvem será substituído.')) return; autoBackup('antes de enviar para a nuvem'); await cloudUpload() && toast('☁️ Enviado para a nuvem.'); }
  if (run === 'pull') {
    if (!ask('Usar o progresso da NUVEM neste aparelho? O deste aparelho será substituído.')) return;
    autoBackup('antes de usar o da nuvem');
    const { data, error } = await sb.from('user_data').select('data').eq('user_id', acct.user.id).maybeSingle();
    if (error) return toast('⚠️ ' + sbErr(error));
    takeCloudKeys(data?.data);
    state = normalizeState(data?.data || {}, state.scope);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
    toast('📥 Progresso da nuvem aplicado.');
  }
  if (run === 'orphans') {
    if (!ask('Apagar os registros de jogos que não estão mais no app?')) return;
    autoBackup('antes de limpar jogos que saíram');
    for (const k of ['done', 'doneAt', 'notes', 'badges', 'checks']) for (const id of Object.keys(state[k])) if (!byId[id]) delete state[k][id];
    save(); toast('🧹 Registros limpos.');
  }
  if (run === 'search') { ai.gSearchPausedUntil = 0; ai.gSearchBlock = {}; ai.gDeadModels = {}; saveAi(); toast('🔎 Pesquisa reativada.'); }
  if (run === 'frames') { frameSeen = {}; try { localStorage.removeItem(FRAME_KEY); } catch {} toast('🔎 Olhando as molduras de novo...'); await scanFrames().catch(() => {}); }
  if (run === 'restore') {
    const b = lastBackup();
    if (!b || !confirm(`Recuperar o backup de ${new Date(b.at).toLocaleString('pt-BR')} (${b.reason})? O progresso atual será substituído.`)) return;
    state = normalizeState(b.state, state.scope); save(); toast('♻️ Backup recuperado.');
  }
  runDiag();
}

// Mapa do sistema: o The Hollow no meio, os grupos em volta e cada verificação ligada ao seu grupo.
// Verde = funcionando · amarelo = possível falha, mas funcionando · vermelho = falha total. O grupo fica com a pior cor dos seus itens.
const DG = { ok: '#22c55e', warn: '#eab308', bad: '#ef4444' };
const DG_ICON = { Servidor: '🗄️', Conta: '👤', Rastreamento: '🔄', Navegador: '🌐', Dados: '🎮', Oráculo: '🔮', Roblox: '🟥', App: '⚙️' };
const worst = list => list.some(i => i.st === 'bad') ? 'bad' : list.some(i => i.st === 'warn') ? 'warn' : 'ok';
let dgView = { x: 0, y: 0, w: 1000, h: 700 }, dgMoved = false; // dgMoved: a pessoa deu zoom ou arrastou (aí o mapa não se reenquadra sozinho)
// enquadra o mapa nos pontos (com folga para os nomes), sem o espaço vazio em volta
function dgFit(nodes) {
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  // embaixo sobra mais espaço: a legenda e a contagem ficam nos cantos de baixo, por cima do mapa
  const x = Math.min(...xs) - 90, y = Math.min(...ys) - 40, w = Math.max(...xs) + 90 - x, h = Math.max(...ys) + 130 - y;
  return { x, y, w, h };
}
function diagGraph() {
  const groups = [...new Set(diag.items.map(i => i.group))];
  const C = { x: 500, y: 350 }, nodes = [{ id: 'root', label: 'The Hollow', st: worst(diag.items), x: C.x, y: C.y, r: 30, kind: 'root' }], edges = [];
  groups.forEach((g, gi) => {
    const a = -Math.PI / 2 + gi * 2 * Math.PI / groups.length, items = diag.items.filter(i => i.group === g);
    const gx = C.x + 175 * Math.cos(a), gy = C.y + 175 * Math.sin(a);
    nodes.push({ id: 'g:' + g, label: `${DG_ICON[g] || ''} ${g}`, st: worst(items), x: gx, y: gy, r: 20, kind: 'group', group: g });
    edges.push(['root', 'g:' + g]);
    const spread = Math.min(Math.PI * .95, Math.max(.5, (items.length - 1) * .42));
    items.forEach((it, k) => {
      const b = a + (items.length > 1 ? -spread / 2 + k * spread / (items.length - 1) : 0);
      const dist = 105 + (k % 2) * 34; // alterna a distância para os nomes não se encostarem
      const id = 'i:' + diag.items.indexOf(it);
      nodes.push({ id, label: it.title.replace(/^Tabela /, ''), st: it.st, x: gx + dist * Math.cos(b), y: gy + dist * Math.sin(b), r: 11, kind: 'item', item: it });
      edges.push(['g:' + g, id]);
    });
  });
  return { nodes, edges };
}
function renderDiagMap() {
  const { nodes, edges } = diagGraph(), byKey = Object.fromEntries(nodes.map(n => [n.id, n]));
  if (!dgMoved && nodes.length > 1) dgView = dgFit(nodes);
  const sel = ui.diagSel, short = t => t.length > 24 ? t.slice(0, 23) + '…' : t;
  const svg = `<svg id="diagSvg" viewBox="${dgView.x} ${dgView.y} ${dgView.w} ${dgView.h}" xmlns="http://www.w3.org/2000/svg">
    ${edges.map(([a, b]) => { const A = byKey[a], B = byKey[b]; return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${B.st === 'ok' ? '#2d2d3a' : DG[B.st]}" stroke-opacity="${B.st === 'ok' ? .9 : .45}" stroke-width="${A.kind === 'root' ? 2 : 1.3}"/>`; }).join('')}
    ${nodes.map(n => `<g class="dg-node ${n.st} ${sel === n.id ? 'sel' : ''}" data-dnode="${n.id}">
      <circle class="dot" cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${DG[n.st]}" stroke="${n.kind === 'item' ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.25)'}" style="filter:drop-shadow(0 0 ${n.kind === 'item' ? 5 : 10}px ${DG[n.st]})"/>
      ${sel === n.id ? `<circle class="ring" cx="${n.x}" cy="${n.y}" r="${n.r + 5}"/>` : ''}
      ${n.kind === 'root' ? `<text x="${n.x}" y="${n.y + 7}" style="font-size:20px;stroke-width:0">🎃</text>` : ''}
      <text class="${n.kind === 'item' ? '' : 'g'}" x="${n.x}" y="${n.y + n.r + (n.kind === 'item' ? 13 : 17)}">${esc(short(n.label))}</text>
    </g>`).join('')}
  </svg>`;
  const it = sel?.startsWith('i:') ? diag.items[+sel.slice(2)] : null, gr = sel?.startsWith('g:') ? sel.slice(2) : null;
  const stTag = st => `<span class="st" style="background:${DG[st]}22;color:${DG[st]};border:1px solid ${DG[st]}66">${{ ok: 'Funcionando', warn: 'Possível falha (funcionando)', bad: 'Falha total' }[st]}</span>`;
  const counts = ['ok', 'warn', 'bad'].map(k => diag.items.filter(i => i.st === k).length);
  // os itens com problema já mostram o motivo (sem precisar clicar)
  const row = i => `<div class="diag-row ${i.st}" data-dnode="i:${diag.items.indexOf(i)}" style="cursor:pointer;padding:8px 10px;user-select:none"><span style="color:${DG[i.st]}">●</span><div><b style="font-size:13px">${esc(i.title)}</b>${i.st !== 'ok' ? `<small style="display:block;margin-top:2px">${esc(i.detail.length > 140 ? i.detail.slice(0, 139) + '…' : i.detail)}</small>` : ''}</div></div>`;
  const side = it ? `<h4>${esc(it.title)}</h4>${stTag(it.st)}<div class="muted small" style="margin-bottom:6px">Grupo: ${esc(it.group)}</div><p style="margin:0">${esc(it.detail)}</p>

        : it.fix ? '<p class="muted small" style="margin:10px 0 0">🔒 Tem correção, mas só o Dev pode aplicar.</p>' : ''}`
    : gr ? `<h4>${DG_ICON[gr] || ''} ${esc(gr)}</h4>${stTag(worst(diag.items.filter(i => i.group === gr)))}${diag.items.filter(i => i.group === gr).map(row).join('')}`
    : `<h4>🎃 The Hollow</h4>${diag.items.length ? stTag(worst(diag.items)) : ''}
      <p style="margin:0 0 8px">${diag.running ? 'Conferindo...' : diag.items.length ? `${counts[0]} funcionando · ${counts[1]} com possível falha · ${counts[2]} com falha total.` : 'Rode o diagnóstico.'}</p>
      <p class="muted small" style="margin:0">Clique num ponto do mapa para ver o que foi conferido e as correções. Arraste para mover; use + e − (ou a roda do mouse) para dar zoom.</p>
      ${diag.items.filter(i => i.st !== 'ok').map(row).join('')}`;
  return `<div class="dg-wrap">
    <div class="dg-map">${diag.items.length ? svg : `<div style="height:520px;display:grid;place-items:center" class="muted">${diag.running ? '🔎 Conferindo...' : 'Rode o diagnóstico para ver o mapa.'}</div>`}
      <div class="dg-ctrl"><button data-dgzoom="in" title="Aproximar">+</button><button data-dgzoom="out" title="Afastar">−</button><button data-dgzoom="fit" title="Centralizar">⤢</button></div>
      <div class="dg-legend"><b style="margin-bottom:2px">Legenda</b><span><i style="background:${DG.ok}"></i>Funcionando</span><span><i style="background:${DG.warn}"></i>Possível falha, mas funcionando</span><span><i style="background:${DG.bad}"></i>Falha total</span></div>
      <div class="dg-info">${nodes.length} pontos · ${edges.length} ligações · zoom ${Math.round(1000 / dgView.w * 100)}%</div>
    </div>
    <div class="dg-side">${side}</div>
  </div>`;
}
// zoom (botões e roda do mouse) e arrastar o mapa: mexe só no viewBox, sem redesenhar a página
function dgZoom(f, cx = dgView.x + dgView.w / 2, cy = dgView.y + dgView.h / 2) {
  dgMoved = true;
  const w = Math.min(2000, Math.max(250, dgView.w * f)), h = w * dgView.h / dgView.w;
  dgView = { x: cx - (cx - dgView.x) * w / dgView.w, y: cy - (cy - dgView.y) * h / dgView.h, w, h };
  const svg = $('#diagSvg'); if (svg) svg.setAttribute('viewBox', `${dgView.x} ${dgView.y} ${dgView.w} ${dgView.h}`);
  const info = $('.dg-info'); if (info) info.textContent = info.textContent.replace(/zoom \d+%/, `zoom ${Math.round(1000 / dgView.w * 100)}%`);
}
let dgDrag = null;
document.addEventListener('pointerdown', e => {
  const svg = e.target.closest?.('#diagSvg');
  if (!svg || e.target.closest('.dg-node')) return;
  dgMoved = true;
  // quantas unidades do mapa cabem em 1 pixel (o mapa é encaixado sem distorcer, então vale o lado que limita)
  dgDrag = { x: e.clientX, y: e.clientY, v: { ...dgView }, k: Math.max(dgView.w / svg.clientWidth, dgView.h / svg.clientHeight) };
  svg.classList.add('drag'); svg.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if (!dgDrag) return;
  dgView = { ...dgDrag.v, x: dgDrag.v.x - (e.clientX - dgDrag.x) * dgDrag.k, y: dgDrag.v.y - (e.clientY - dgDrag.y) * dgDrag.k };
  $('#diagSvg')?.setAttribute('viewBox', `${dgView.x} ${dgView.y} ${dgView.w} ${dgView.h}`);
});
document.addEventListener('pointerup', () => { if (dgDrag) { dgDrag = null; $('#diagSvg')?.classList.remove('drag'); } });
document.addEventListener('wheel', e => {
  const svg = e.target.closest?.('#diagSvg');
  if (!svg) return;
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  dgZoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, dgView.x + (e.clientX - r.left) / r.width * dgView.w, dgView.y + (e.clientY - r.top) / r.height * dgView.h);
}, { passive: false });

function makePlan(mins) {

  for (const g of pendingOrder()) {
    const need = g.type === 'main' ? 15 : 10;
    if (left < need) continue;
    const d = gameData(g.id) || {}, b = hollowBadgesOf(d).find(b => !state.badges[g.id]?.[b.id]);
    steps.push(`<li><b>${esc(g.name)}</b> (~${need} min)${b ? ` · pegar o emblema <b>${esc(b.name)}</b>${b.desc ? `: ${esc(b.desc.slice(0, 90))}` : ''}` : ''}</li>`);
    left -= need;
  }
  ui.draft = `Monte um plano de ${mins} minutos para eu avançar no The Hollow, com o passo a passo de cada jogo pendente.`;
  return `<div class="ck-plan"><b>Plano de ${mins} minutos</b>${steps.length ? `<ol style="margin:6px 0 0 18px;padding:0">${steps.join('')}</ol>` : '<br>Nenhum jogo cabe nesse tempo (ou nada está pendente).'}
